<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE% — the womb-to-tomb speedrun</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8ef;
    --ink: #2d2440;
    --ink-soft: #8d81a8;
    --coral: #ff5da2;
    --coral-d: #d63d82;
    --teal: #3fc1c9;
    --teal-d: #2b98a0;
    --mustard: #ffb703;
    --mustard-d: #d18f00;
    --lav: #9b6ef3;
    --lav-d: #7649d1;
    --card: #fdf8ef;
    --tf: 'Titan One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
    --bf: 'Baloo 2', 'Avenir Next', 'Trebuchet MS', sans-serif;
    --mf: 'Space Mono', 'Menlo', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--bf); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; background: #1b1230; }
  #app { position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 18%, #37265a 0%, #1b1230 72%); }
  #world { position: absolute; width: 960px; height: 640px; transform-origin: 0 0; touch-action: none; }
  #world.shake { animation: wsh .3s; }
  @keyframes wsh { 25%{margin-left:-7px} 50%{margin-left:6px} 75%{margin-left:-4px} }
  #cv { position: absolute; inset: 0; border-radius: 26px; }
  /* ---------- HUD ---------- */
  .chip { position: absolute; z-index: 20; display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 14px; padding: 5px 15px;
    border: 3px solid var(--ink); box-shadow: 4px 5px 0 rgba(0,0,0,.45); }
  .chip .lb { font-size: 9px; font-weight: 800; letter-spacing: 1.6px; color: var(--ink-soft); }
  .chip .vl { font-family: var(--tf); font-weight: 400; font-size: 19px; color: var(--ink); }
  #logo { left: 14px; top: 12px; background: var(--mustard); }
  #logo .vl { font-size: 21px; letter-spacing: .5px; color: var(--ink); }
  #logo .vl b { color: #fff; text-shadow: 2px 2px 0 var(--coral-d); }
  #agechip { left: 156px; top: 12px; }
  #agechip .vl { color: var(--teal-d); }
  #timechip { right: 60px; top: 12px; }
  #timechip .vl { font-family: var(--mf); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  #lifechip { right: 190px; top: 12px; }
  #lifechip .vl { color: var(--lav-d); }
  #mutebtn { position: absolute; right: 14px; top: 12px; z-index: 20; width: 38px; height: 38px;
    border-radius: 12px; background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--ink); box-shadow: 3px 4px 0 rgba(0,0,0,.45); font-size: 16px; }
  #mutebtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
  /* timeline of life */
  #tl { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 20;
    width: 700px; height: 26px; }
  #tl .bar { position: absolute; left: 0; right: 0; top: 10px; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.18); }
  #tl .fill { position: absolute; left: 0; top: 10px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, var(--teal), var(--mustard), var(--coral));
    transition: width .6s cubic-bezier(.3,1.4,.5,1); }
  #tl .dot { position: absolute; top: 9px; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,.35); transform: translateX(-50%); }
  #tl .dot.done { background: #fff; }
  #tl .baby, #tl .grave { position: absolute; top: -4px; font-size: 17px; }
  #tl .baby { left: -26px; } #tl .grave { right: -26px; }
  #hint { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 20;
    font-family: var(--bf); font-weight: 800; font-size: 15px; color: var(--ink);
    background: var(--card); border-radius: 14px; padding: 7px 20px; white-space: nowrap;
    border: 3px solid var(--ink); box-shadow: 4px 5px 0 rgba(0,0,0,.45); }
  #hint:empty { display: none; }
  #hint .k { background: #f3e8d9; border: 2px solid #e0d0bc; border-bottom-width: 3px;
    border-radius: 6px; padding: 0 7px; font-size: 12.5px; margin: 0 2px; }
  /* pops */
  .pop { position: absolute; z-index: 40; font-family: var(--tf); font-weight: 700; font-size: 24px;
    color: #fff; text-shadow: 0 2.5px 0 rgba(53,40,46,.7), 0 6px 14px rgba(0,0,0,.4);
    transform: translateX(-50%); white-space: nowrap; pointer-events: none; animation: pr 1.1s forwards; }
  @keyframes pr { 0%{opacity:0;transform:translate(-50%,10px) scale(.6)} 18%{opacity:1;transform:translate(-50%,-4px) scale(1.15)} 100%{opacity:0;transform:translate(-50%,-56px)} }
  .pop.gold { color: var(--mustard); }
  .pop.red { color: #ff9d8e; }
  .pop.small { font-size: 16px; }
  /* ---------- Stage card ---------- */
  #stagecard { position: fixed; inset: 0; z-index: 55; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; pointer-events: none;
    background: rgba(24,15,44,.6); backdrop-filter: blur(4px); }
  #stagecard .agebig { font-family: var(--tf); font-weight: 700; font-size: 22px; letter-spacing: 3px;
    color: var(--mustard); text-shadow: 0 3px 0 rgba(0,0,0,.4); animation: cin .5s backwards; }
  #stagecard .tt { font-family: var(--tf); font-weight: 700; font-size: clamp(34px,7vw,60px);
    color: #fff; text-align: center; line-height: 1.05; letter-spacing: 1px;
    text-shadow: 0 5px 0 var(--coral-d), 0 12px 28px rgba(0,0,0,.5); animation: cin .5s .08s backwards; }
  #stagecard .sb { font-weight: 800; font-size: 16px; color: rgba(255,255,255,.92);
    animation: cin .5s .16s backwards; text-align:center; max-width: 80vw; }
  #stagecard .ctl { font-family: var(--tf); font-weight: 600; font-size: 14px; color: var(--ink);
    background: #fff; border-radius: 999px; padding: 7px 18px; margin-top: 8px;
    box-shadow: 0 4px 0 rgba(0,0,0,.25); animation: cin .5s .24s backwards; }
  @keyframes cin { 0%{opacity:0;transform:translateY(18px) scale(.85)} 100%{opacity:1;transform:none} }
  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 18px;
    overflow-y: auto; background: rgba(24,15,44,.8); backdrop-filter: blur(10px); }
  .overlay h1 { font-family: var(--tf); font-weight: 700; font-size: clamp(34px,6.8vw,56px);
    color: #fff; letter-spacing: 1px; line-height: 1.02; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .overlay h1 .acc { color: var(--mustard); }
  .overlay h1 .bad { color: var(--coral); }
  .overlay .sub { font-size: 12.5px; font-weight: 900; letter-spacing: 2.5px; color: #cbb3be; text-transform: uppercase; }
  .wcard { width: min(92vw, 430px); background: var(--card); border-radius: 18px; overflow: hidden;
    text-align: left; position: relative; border: 4px solid var(--ink);
    box-shadow: 9px 10px 0 rgba(0,0,0,.4); }
  .wcard .wh { font-family: var(--tf); font-weight: 400; font-size: 14px; letter-spacing: 2px;
    color: #fff; text-align: center; padding: 11px 16px; background: var(--teal);
    border-bottom: 4px solid var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .wcard .wh.red { background: var(--coral); }
  .wcard .wh.gold { background: var(--mustard); color: var(--ink); text-shadow: none; }
  .wcard .wb { padding: 5px 20px 4px; }
  .wr { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0;
    opacity: 0; animation: rin .4s forwards; animation-delay: var(--d,0s); }
  @keyframes rin { 0%{opacity:0;transform:translateX(-14px)} 100%{opacity:1;transform:none} }
  .wr + .wr { border-top: 2px dashed #efe2d0; }
  .wr .lb { color: var(--ink-soft); font-size: 10px; letter-spacing: 1.5px; font-weight: 800; text-transform: uppercase; }
  .wr .vl { color: var(--ink); font-family: var(--bf); font-weight: 800; font-size: 15.5px; text-align: right; }
  .wr .vl.gold { color: var(--mustard-d); }
  .wr .vl.bad { color: var(--coral-d); }
  .wr .vl.good { color: var(--teal-d); }
  .wflav { font-size: 13px; font-weight: 800; color: #6f6288;
    text-align: center; padding: 10px 22px 14px; }
  .tomb { font-size: 64px; line-height: 1; animation: tdrop .6s cubic-bezier(.3,1.5,.5,1) backwards; }
  @keyframes tdrop { 0%{opacity:0;transform:translateY(-60px) rotate(-8deg)} 100%{opacity:1;transform:none} }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { font-family: var(--tf); font-weight: 400; font-size: 16.5px; letter-spacing: 1px; cursor: pointer;
    padding: 15px 34px; border-radius: 999px; color: #fff; border: none;
    background: linear-gradient(180deg, #ff7eb6 0%, #f5539b 55%, #e83a8a 100%);
    text-shadow: 0 1.5px 0 rgba(0,0,0,.22);
    box-shadow: 0 4px 0 #b02a6b, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.45);
    transition: transform .13s cubic-bezier(.3,1.6,.5,1), box-shadow .13s, filter .13s; }
  button.teal { background: linear-gradient(180deg, #62dde2 0%, #38b9c2 55%, #2599a4 100%);
    box-shadow: 0 4px 0 #17707a, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.45); }
  button.grape { background: linear-gradient(180deg, #bb9bf8 0%, #9666f0 55%, #7e4ce4 100%);
    box-shadow: 0 4px 0 #5c34ad, 0 12px 26px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.45); }
  button.ghost { background: rgba(255,255,255,.09);
    box-shadow: 0 4px 0 rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.32); text-shadow: none; }
  button:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.06); }
  button:active { transform: translateY(3px) scale(.99); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .keyhint { font-size: 11.5px; font-weight: 800; color: rgba(255,255,255,.55); letter-spacing: 1.2px; }
  .stamp { position: absolute; top: 46px; right: 12px; transform: rotate(9deg);
    font-family: var(--tf); font-weight: 700; font-size: 13px; letter-spacing: 1px; color: #fff;
    background: var(--lav); border-radius: 9px; padding: 4px 11px; opacity: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,.25); animation: stin .45s .8s forwards; }
  @keyframes stin { 0%{opacity:0;transform:rotate(9deg) scale(2.1)} 60%{opacity:1;transform:rotate(9deg) scale(.92)} 100%{opacity:1;transform:rotate(9deg) scale(1)} }
  /* ---------- home menu ---------- */
  .wordmark { font-family: var(--tf); font-size: clamp(64px, 13vw, 112px); color: #fff;
    letter-spacing: 2px; line-height: .9;
    text-shadow: 0 6px 0 var(--coral-d), 0 12px 0 rgba(0,0,0,.35); animation: wob 3.2s ease-in-out infinite; }
  .wordmark span { color: var(--mustard); text-shadow: 0 6px 0 var(--mustard-d), 0 12px 0 rgba(0,0,0,.35); }
  @keyframes wob { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
  .tagline { font-weight: 800; font-size: 15.5px; color: #d8cdf0; letter-spacing: .5px; margin-top: -2px; }
  .strow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 6px 0 2px; }
  .sticker { background: var(--card); border: 3px solid var(--ink); border-radius: 14px;
    padding: 7px 16px; box-shadow: 4px 5px 0 rgba(0,0,0,.4); text-align: center; }
  .sticker .lb { font-size: 9px; font-weight: 800; letter-spacing: 1.6px; color: var(--ink-soft); }
  .sticker .vl { font-family: var(--tf); font-size: 18px; color: var(--ink); }
  .sticker .vl.mono { font-family: var(--mf); font-weight: 700; font-size: 15px; }
  .menu-btns { display: flex; flex-direction: column; gap: 13px; width: min(78vw, 280px); margin-top: 8px; }
  .menu-btns button { width: 100%; }
  .menu-btns button:hover { transform: translateY(-2px) scale(1.02); }
  .dtitle { font-size: 11px; font-weight: 800; letter-spacing: 2.4px; color: #b8a8d8; margin-top: 10px; }
  .diffrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .diffbtn { font-family: var(--tf); font-weight: 400; font-size: 12px; letter-spacing: .8px;
    padding: 10px 16px; border-radius: 999px; border: none;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.55);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.16); text-shadow: none; }
  .diffbtn.on { background: linear-gradient(180deg, #ffd166 0%, #f9b62a 60%, #ef9f0e 100%);
    color: #5c3d00;
    box-shadow: 0 3px 0 #bd7c0a, 0 8px 18px rgba(0,0,0,.35), inset 0 2px 1px rgba(255,255,255,.5); }
  .diffbtn:hover { transform: translateY(-2px); }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 69; overflow: hidden; }
  .confetti i { position: absolute; top: -30px; border-radius: 3px; animation: cfall linear forwards; }
  @keyframes cfall { 0%{transform:translateY(0) rotate(0)} 100%{transform:translateY(108vh) rotate(400deg)} }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <canvas id="cv" width="960" height="640"></canvas>
    <div class="chip" id="logo"><span class="vl">LIFE<b>%</b></span></div>
    <div class="chip" id="agechip"><div><div class="lb">AGE</div><div class="vl" id="age-v">0</div></div></div>
    <div class="chip" id="lifechip"><div><div class="lb">LIFE #</div><div class="vl" id="life-v">1</div></div></div>
    <div class="chip" id="timechip"><div><div class="lb">RUN TIME</div><div class="vl" id="time-v">0:00.0</div></div></div>
    <div id="mutebtn" title="Sound (M)"></div>
    <div id="tl">
      <span class="baby"><svg viewBox="0 0 20 20" width="17"><circle cx="10" cy="11" r="7.5" fill="#ffb3c1"/><path d="M10 3.6 q3 -2.6 5 -.8" stroke="#5b3a24" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="7.4" cy="10" r="1.1" fill="#2d2440"/><circle cx="12.6" cy="10" r="1.1" fill="#2d2440"/><path d="M8.4 13.4 q1.6 1.4 3.2 0" stroke="#2d2440" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></span><span class="grave"><svg viewBox="0 0 20 20" width="17"><path d="M4.5 17.5 v-8 a5.5 5.5 0 0 1 11 0 v8 z" fill="#9aa5b1"/><rect x="2.5" y="16.8" width="15" height="2.6" rx="1.3" fill="#7a8590"/><path d="M7.5 9.5 h5 M10 7 v6" stroke="#5c6570" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <div class="bar"></div><div class="fill" id="tl-fill" style="width:0"></div>
      <div id="tl-dots"></div>
    </div>
    <div id="hint"></div>
  </div>
</div>
<script>
"use strict";
/* ==========================================================
   LIFE% — the womb-to-tomb speedrun
   One life. 17 minigames. Any mistake is permanent.
   ========================================================== */
const world = document.getElementById('world');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 960, H = 640;
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.985;
  world.style.transform = `translate(${(innerWidth - W * scale) / 2}px, ${(innerHeight - H * scale) / 2}px) scale(${scale})`;
}
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
/* ---------- palette ---------- */
const C = {
  cream:'#fdf8ef', ink:'#2d2440', coral:'#ff5da2', coralD:'#d63d82',
  teal:'#3fc1c9', tealD:'#2b98a0', mustard:'#ffb703', mustardD:'#d18f00',
  lav:'#9b6ef3', lavD:'#7649d1', sky:'#7fd8f7', leaf:'#8fd14f', skin:'#ffd9a8',
  pinkbg:'#ffd3e0', night:'#241b3e'
};
/* ---------- audio ---------- */
let AC = null, muted = localStorage.getItem('lp_mute') === '1';
function ac() { if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return AC; }
function tone(f, d, vol, type, when) {
  if (muted || !ac()) return;
  try {
    const t0 = AC.currentTime + (when||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d);
  } catch(e){}
}
const sfx = {
  blip(){ tone(520,.06,.05,'square'); },
  boop(){ tone(300,.08,.05,'square'); },
  good(){ tone(620,.09,.05,'square'); tone(930,.12,.045,'square',.06); },
  big(){ [523,659,784,1047].forEach((f,i)=>tone(f,.15,.05,'square',i*.08)); },
  bad(){ tone(170,.2,.07,'sawtooth'); },
  buzz(){ tone(110,.28,.07,'sawtooth'); tone(104,.28,.05,'sawtooth',.02); },
  tick(){ tone(760,.04,.035,'square'); },
  pop(){ tone(340,.06,.06,'square'); tone(660,.09,.05,'square',.05); },
  flat(){ tone(480,1.8,.05,'sine'); },
  harp(){ [392,494,587,784,988].forEach((f,i)=>tone(f,.5,.04,'triangle',i*.13)); },
  cry(){ tone(880,.3,.05,'sawtooth'); tone(830,.3,.05,'sawtooth',.3); },
  snore(){ tone(140,.4,.04,'sawtooth'); },
  splash(){ tone(280,.1,.05,'triangle'); tone(180,.14,.04,'triangle',.06); },
};
function muteIcon() {
  $('mutebtn').innerHTML = `<svg viewBox="0 0 24 24" width="19"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2d2440"/>` +
    (muted
      ? `<path d="M16 9l6 6M22 9l-6 6" stroke="#d63d82" stroke-width="2.4" stroke-linecap="round" fill="none"/>`
      : `<path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6.2a8 8 0 0 1 0 11.6" stroke="#2b98a0" stroke-width="2.2" fill="none" stroke-linecap="round"/>`) +
    `</svg>`;
}
$('mutebtn').addEventListener('click', () => {
  muted = !muted; localStorage.setItem('lp_mute', muted?'1':'0');
  muteIcon();
});
muteIcon();
/* ---------- input ---------- */
const keys = {};
let pointerHeld = false, px = 480, py = 320, pHalf = 0; // -1 left, 1 right
function worldPos(e) {
  const r = world.getBoundingClientRect();
  return [ (e.clientX - r.left) / scale, (e.clientY - r.top) / scale ];
}
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  const rep = !!keys[e.code];
  keys[e.code] = true;
  if (rep) return;
  if (ac() && AC.state === 'suspended') AC.resume();
  if (e.code === 'KeyM') { $('mutebtn').click(); return; }
  handlePress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; handleRelease(e.code); });
world.addEventListener('pointerdown', e => {
  if (ac() && AC.state === 'suspended') AC.resume();
  pointerHeld = true;
  [px, py] = worldPos(e);
  pHalf = px < W/2 ? -1 : 1;
  handlePress('Pointer', px, py);
});
world.addEventListener('pointermove', e => { [px, py] = worldPos(e); if (pointerHeld) pHalf = px < W/2 ? -1 : 1; });
addEventListener('pointerup', () => { pointerHeld = false; pHalf = 0; handleRelease('Pointer'); });
function heldLR() {
  let d = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) d -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) d += 1;
  if (pointerHeld) d += pHalf;
  return clamp(d, -1, 1);
}
function heldUD() {
  let d = 0;
  if (keys['ArrowUp'] || keys['KeyW']) d -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) d += 1;
  if (pointerHeld) d += (py < H/2 ? -1 : 1);
  return clamp(d, -1, 1);
}
/* ---------- draw helpers ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(t, x, y, size, col, weight, align) {
  ctx.font = `${weight||800} ${size}px 'Baloo 2', 'Avenir Next', 'Trebuchet MS', sans-serif`;
  ctx.fillStyle = col; ctx.textAlign = align||'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
/* hand-drawn mini icons — zero emojis allowed in this establishment */
function icon(name, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  const k = (s || 30) / 30;
  ctx.scale(k, k);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (name) {
    case 'mailbox':
      ctx.fillStyle = '#8a6540'; ctx.fillRect(-2, 2, 4, 14);
      ctx.fillStyle = C.coral; rr(-12, -12, 24, 14, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(6, -10, 3, 6);
      break;
    case 'glasses':
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-6, 0, 5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(6, 0, 5, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(1, 0); ctx.stroke();

function updateTL() {

    // handled by overlay button too
  }

}
function applyDiff() {
  const D = DIFFS[diffI];

    });
  });
  spaceAction = startRun;
}
/* ---------- title backdrop ---------- */
let titleT = 0;
function drawTitleBG(dt) {
  titleT += dt;
  bgFlat(C.cream);
  // parade of Bubs across all ages
  const ages = [0, 6, 15, 23, 35, 47, 65, 87];
  ground('#e8d8be', 480);
  ages.forEach((a, i) => {
    const x = 90 + i * 112;
    drawBub(x, 440 + Math.sin(titleT*2 + i)*6, .9 + (a===87?0:0), a, 'happy', { walk: titleT + i });
  });
  txt('← it goes fast', W/2, 540, 16, 'rgba(53,40,46,.4)', 600);
}
/* ---------- HUD ---------- */
let hudT = 0;
function updateHUD(dt) {
  hudT -= dt;
  if (hudT > 0) return;
  hudT = .08;
  $('time-v').textContent = fmtT(runT);
}
/* ---------- main loop ---------- */
let last = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last)/1000) || 0;
  last = t;
  if (state === 'title') {
    drawTitleBG(dt);
  } else if (state === 'card') {
    cardT += dt;
    stage.draw();
    if (cardT > 2.1) { hideCard(); state = 'play'; setHint(stage.hint); sfx.tick(); }
  } else if (state === 'play') {
    stageT += dt; runT += dt;
    stage.update(dt);
    // stage may have changed state (win/die)
    if (state === 'play' || state === 'won' || state === 'dead') stage.draw();
  } else if (state === 'won') {
    wonT += dt;
    stage.draw();
    if (wonT > .9) nextStage();
  } else if (state === 'dead') {
    stage.draw();
    // grim overlay
    ctx.fillStyle = 'rgba(120,20,30,.28)';
    ctx.fillRect(0, 0, W, H);
    drawBub(W/2, H/2, 1.6, stage.age, 'dead', { noShadow: true });
    icon('ghost', W/2 + 60, H/2 - 90, 36);
  } else if (state === 'end') {
    bgFlat('#f4ead8');
  }
  updateHUD(dt);
  requestAnimationFrame(loop);
}
updateTL();
showTitle();
requestAnimationFrame(loop);
</script>
