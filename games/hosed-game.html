<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOSED! — Save the village</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7efdd;
    --gold: #ffd671;
    --title-font: 'Lilita One', cursive;
    --body-font: 'Nunito', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--body-font); user-select: none; -webkit-tap-highlight-color: transparent; background: #0c1420; }

  /* ---------- WORLD (1600x900, scaled to cover viewport) ---------- */
  #app { position: fixed; inset: 0; overflow: hidden; }
  #world { position: absolute; width: 1600px; height: 900px; transform-origin: 0 0; cursor: none; touch-action: none; }
  #nozzle-cur { position: absolute; width: 64px; z-index: 42; pointer-events: none;
    transform-origin: 30% 50%; display: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4)); }
  #nozzle-cur svg { width: 100%; display: block; }
  #sky { position: absolute; inset: 0; }
  #sun { position: absolute; border-radius: 50%; filter: blur(2px); }
  .cloud { position: absolute; opacity: 0.85; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; pointer-events: none; }
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 225px;
    background:
      repeating-linear-gradient(83deg, rgba(255,255,255,0.025) 0 3px, transparent 3px 14px),
      linear-gradient(180deg, #6a9c50 0%, #58853e 40%, #4d7736 100%); }
  #road { position: absolute; left: 0; right: 0; bottom: 52px; height: 80px;
    background: linear-gradient(180deg, #56514b 0%, #3f3b36 100%);
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.32); }
  #road::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 12px;
    background: linear-gradient(180deg, #948b7c, #6e675c); box-shadow: 0 2px 3px rgba(0,0,0,0.25); }
  #road::after { content: ''; position: absolute; left: 0; right: 0; top: 36px; height: 5px;
    background: repeating-linear-gradient(90deg, #d8d0bd 0 46px, transparent 46px 98px); opacity: 0.75; }
  #tint { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 31;
    background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(8,10,18,0.3) 100%); }
  .prop { position: absolute; pointer-events: none; z-index: 4; }
  .prop svg { width: 100%; display: block; }

  .slot { position: absolute; bottom: 128px; }
  .slot .bld { position: relative; }
  .slot .bld svg { width: 100%; display: block; }
  .slot .char { position: absolute; inset: 0; border-radius: 8px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 20%, rgba(20,12,8,0.85), rgba(20,12,8,0.2) 70%, transparent);
    opacity: 0; }
  .hp-bar { position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    width: 70px; height: 9px; border-radius: 5px; background: rgba(10,14,20,0.55);
    border: 1.5px solid rgba(255,255,255,0.35); overflow: hidden; pointer-events: none; display: none; }
  .hp-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #e8542e); }

  #fireman { position: absolute; bottom: 88px; width: 96px; pointer-events: none; z-index: 20; }
  #fireman svg { width: 100%; display: block; }
  #dog { position: absolute; bottom: 90px; width: 54px; pointer-events: none; z-index: 19; }
  #dog svg { width: 100%; display: block; }
  #truck { position: absolute; bottom: 104px; left: 4px; width: 186px; pointer-events: none; z-index: 18; }
  #truck svg { width: 100%; display: block; }
  #aircraft { position: absolute; z-index: 26; pointer-events: none; display: none; }
  #aircraft svg { display: block; width: 100%; }

  #fx { position: absolute; inset: 0; z-index: 25; pointer-events: none; }

  .pop { position: absolute; z-index: 40; font-family: var(--title-font); font-size: 22px; color: #fff;
    text-shadow: 0 2px 0 rgba(60,20,10,0.8), 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
    white-space: nowrap; animation: poprise 1.15s forwards; transform: translateX(-50%); letter-spacing: 1px; }
  @keyframes poprise {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
    20% { opacity: 1; transform: translate(-50%, -4px) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -52px) scale(1); }
  }
  .pop.gold { color: var(--gold); }
  .pop.small { font-size: 16px; }

  /* ---------- UI OVERLAY (not scaled) ---------- */
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(12, 18, 28, 0.62); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255,255,255,0.18); border-radius: 12px;
    padding: 8px 14px; color: var(--cream);
  }
  .chip svg { width: 20px; height: 20px; flex: none; }
  .chip .v { font-family: var(--title-font); font-size: 19px; text-shadow: 0 2px 3px rgba(0,0,0,0.5); }
  #hud-left { position: absolute; top: 14px; left: 14px; display: flex; gap: 8px; }
  #air-btns { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
  .air-btn { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 7px;
    background: rgba(12,18,28,0.62); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 7px 12px; }
  .air-btn:hover { background: rgba(24,34,50,0.75); border-color: rgba(255,255,255,0.4); }
  .air-btn.off { opacity: 0.35; cursor: not-allowed; }
  .air-btn svg { width: 42px; height: 24px; }
  .air-btn .uses { font-family: var(--title-font); font-size: 15px; color: var(--cream); }

  #water-ui { position: absolute; left: 14px; bottom: 14px; width: min(300px, 40vw); }
  #water-ui .lab { font-size: 11px; letter-spacing: 3px; font-weight: 800; color: rgba(247,239,221,0.9);
    margin-bottom: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); display: flex; justify-content: space-between; }
  #water-bar { height: 16px; border-radius: 9px; background: rgba(10,14,20,0.6);
    border: 1.5px solid rgba(255,255,255,0.25); overflow: hidden; }
  #water-bar i { display: block; height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, #2e7fc4, #6fc0ea); }
  #water-bar.low i { background: linear-gradient(90deg, #c43e2e, #ea8a4f); }
  #refill-hint { font-size: 11px; font-weight: 800; color: #9fdc7e; margin-top: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); min-height: 15px; }

  #combo-ui { position: absolute; right: 14px; bottom: 14px;
    font-family: var(--title-font); font-size: 17px; letter-spacing: 1px;
    color: #38251a; background: linear-gradient(180deg, #ffd671, #eda93c);
    border: 2px solid #a86f1e; border-radius: 999px; padding: 7px 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    animation: badgepulse 0.9s ease-in-out infinite; }
  @keyframes badgepulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  #msg { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    max-width: min(70vw, 560px); text-align: center;
    background: rgba(12,18,28,0.55); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 8px 16px;
    font-size: 13px; font-weight: 800; color: var(--cream); line-height: 1.4; }
  #msg:empty { display: none; }
  #msg .hl { color: var(--gold); }

  /* ---------- TITLE CARDS ---------- */
  #title-card { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center;
    justify-content: center; pointer-events: none; }
  #title-card .burst { position: absolute; width: 380px; height: 380px; opacity: 0.5;
    animation: burstspin 1.9s linear forwards; }
  @keyframes burstspin { 0% { transform: rotate(0) scale(0.5); opacity: 0; } 15% { opacity: 0.5; } 85% { opacity: 0.5; } 100% { transform: rotate(40deg) scale(1.1); opacity: 0; } }
  #title-card .tc { font-family: var(--title-font); font-size: clamp(38px, 8vw, 72px);
    color: #fff; text-align: center; line-height: 1.1; letter-spacing: 2px;
    text-shadow: 0 4px 0 #7c2d22, 0 8px 22px rgba(0,0,0,0.6);
    animation: tcpop 1.9s forwards; }
  #title-card .tc.gold { color: var(--gold); }
  #title-card .tc.blue { color: #7fc4ec; text-shadow: 0 4px 0 #2a4a66, 0 8px 22px rgba(0,0,0,0.6); }
  @keyframes tcpop {
    0% { opacity: 0; transform: scale(0.4) rotate(-4deg); }
    14% { opacity: 1; transform: scale(1.1) rotate(1.5deg); }
    24% { transform: scale(1) rotate(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* ---------- OVERLAYS ---------- */
  .overlay { position: fixed; inset: 0; z-index: 70;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 20px; overflow-y: auto;
    background: rgba(9, 13, 20, 0.62); backdrop-filter: blur(8px); }
  #intro { background: linear-gradient(180deg, rgba(9,13,20,0.5) 0%, rgba(9,13,20,0.18) 45%, rgba(9,13,20,0.45) 100%);
    backdrop-filter: none; }
  .row .lab svg { width: 17px; height: 17px; vertical-align: -3px; margin-right: 7px; }
  .overlay h1 { font-family: var(--title-font); font-size: clamp(36px, 7.5vw, 58px);
    color: #f2f5fa; text-shadow: 0 4px 0 rgba(0,0,0,0.4);
    line-height: 1.05; letter-spacing: 1.5px; }
  .overlay h1 .fire { color: #ff9a3c; }
  .card {
    width: min(92vw, 430px); text-align: left; position: relative;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.5), transparent 30%),
      #f7efdd;
    border-radius: 18px; padding: 0 0 16px 0; overflow: hidden;
    box-shadow: 0 8px 0 #b8a488, 0 20px 40px rgba(0,0,0,0.45);
  }
  .card .head {
    font-family: var(--title-font); font-size: 18px; letter-spacing: 2px;
    color: #f7efdd; text-align: center; padding: 12px 16px 10px;
    background: linear-gradient(180deg, #d4582f, #b3441f);
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    border-bottom: 4px solid #8c3218; margin-bottom: 6px;
  }
  .card .body { padding: 4px 22px 0; }
  .row { display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; gap: 12px; opacity: 0; animation: rowin 0.4s forwards;
    animation-delay: var(--d, 0s); }
  @keyframes rowin { 0% { opacity: 0; transform: translateX(-14px); } 100% { opacity: 1; transform: none; } }
  .row + .row { border-top: 2px dashed #ddceb2; }
  .row .lab { color: #a08a6a; font-size: 11px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; }
  .row .val { color: #38251a; font-family: var(--title-font); font-size: 17px;
    display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
  .row .val.gold { color: #c2851c; }
  .row .val.good { color: #4f8f43; }
  .row .val.bad { color: #c4552e; }
  .row .val svg { width: 16px; height: 16px; }
  .rankbar { height: 11px; border-radius: 6px; background: #e4d7bc; overflow: hidden; margin-top: 8px;
    border: 2px solid #d3c3a2; }
  .rankbar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #eda93c, #ffd671); transition: width 1s ease; }
  .flavor { font-size: 12.5px; font-weight: 700; color: #a08a6a; font-style: italic; text-align: center; padding: 12px 20px 0; }
  .stamp {
    position: absolute; top: 52px; right: 14px; transform: rotate(12deg);
    font-family: var(--title-font); font-size: 17px; letter-spacing: 2px; color: #c2851c;
    border: 3px solid #c2851c; border-radius: 10px; padding: 5px 12px; opacity: 0;
    animation: stampin 0.45s 0.9s forwards;
  }
  @keyframes stampin {
    0% { opacity: 0; transform: rotate(12deg) scale(2.4); }
    60% { opacity: 0.95; transform: rotate(12deg) scale(0.92); }
    100% { opacity: 0.9; transform: rotate(12deg) scale(1); }
  }
  .overlay .score-big { font-family: var(--title-font); font-size: 48px; color: var(--gold);
    text-shadow: 0 4px 0 rgba(120,60,10,0.55), 0 8px 20px rgba(0,0,0,0.4); }
  .overlay .sub2 { font-size: 12.5px; font-weight: 800; color: #d9c9a8; letter-spacing: 1.5px; text-transform: uppercase; }
  .coin-rain { position: fixed; inset: 0; pointer-events: none; z-index: 69; overflow: hidden; }
  .coin-rain svg { position: absolute; top: -40px; animation: coinfall linear forwards; }
  @keyframes coinfall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
  }
  button {
    font-family: var(--title-font); font-size: 17px; letter-spacing: 1.5px; cursor: pointer;
    padding: 13px 30px; border-radius: 14px; color: var(--cream);
    background: linear-gradient(180deg, #d4582f, #a83f1f);
    border: none; box-shadow: 0 5px 0 #7c2d15, 0 8px 18px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.25);
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #7c2d15; }
  button.blue { background: linear-gradient(180deg, #3f7cb8, #2b5987); box-shadow: 0 5px 0 #1d3f61, 0 8px 18px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.25); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #shop-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .up-card { width: 122px; border-radius: 14px; padding: 13px 10px 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #f7efdd;
    box-shadow: 0 5px 0 #b8a488, 0 9px 18px rgba(0,0,0,0.35);
    transition: transform 0.08s; }
  .up-card:hover { transform: translateY(-3px); }
  .up-card.disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 0 3px 0 #b8a488; }
  .up-card .ico { width: 48px; height: 34px; }
  .up-card .ico svg { width: 100%; height: 100%; }
  .up-card .nm { font-size: 10.5px; font-weight: 800; color: #5a4632; letter-spacing: 1px; text-align: center; }
  .up-card .pips { display: flex; gap: 4px; }
  .up-card .pips i { width: 8px; height: 8px; border-radius: 50%; background: #ddceb2; }
  .up-card .pips i.on { background: #eda93c; }
  .up-card .cost { font-family: var(--title-font); font-size: 13px; color: #f7efdd;
    background: linear-gradient(180deg, #d4582f, #b3441f); border-radius: 8px; padding: 4px 10px;
    display: flex; align-items: center; gap: 5px; text-shadow: 0 1px 0 rgba(0,0,0,0.3); }
  .up-card .cost svg { width: 13px; height: 13px; }
  .up-card .cost.max { background: linear-gradient(180deg, #5f9f50, #4a8040); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="world">
    <div id="sky"></div>
    <div id="ground"></div>
    <div id="road"></div>
    <canvas id="fx" width="1600" height="900"></canvas>
    <div id="tint"></div>
    <div id="vignette"></div>
  </div>
</div>

<div id="ui">
  <div id="hud-left">
    <div class="chip" id="chip-score"><span class="v" id="score">0</span></div>
    <div class="chip" id="chip-coins"><span class="v" id="coins">0</span></div>
    <div class="chip" id="chip-day"><span class="v" id="day">1</span></div>
  </div>
  <div id="air-btns"></div>
  <div id="water-ui">
    <div class="lab"><span>WATER</span><span id="water-pct">100%</span></div>
    <div id="water-bar"><i style="width:100%"></i></div>
    <div id="refill-hint"></div>
  </div>
  <div id="combo-ui" class="hidden">COMBO ×2</div>
  <div id="mission-ui" class="chip hidden" style="position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:12.5px; font-weight:800;"></div>
  <div id="msg"></div>
</div>

<div class="overlay" id="intro">
  <h1>HOSED<span class="fire">!</span></h1>
  <div style="font-size:14px; font-weight:700; color:#d9c9a8; margin-top:-8px;">The village is burning. You are the fire department.</div>
  <div class="card" style="width:min(92vw, 390px);">
    <div class="head">HOW TO PLAY</div>
    <div class="body">
      <div class="row" style="--d:0.05s"><span class="lab"><svg viewBox="0 0 24 24"><path d="M4 12 h16 M8 8 l-4 4 4 4 M16 8 l4 4 -4 4" stroke="#a08a6a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Move</span><span class="val">follow the mouse</span></div>
      <div class="row" style="--d:0.15s"><span class="lab"><svg viewBox="0 0 24 24"><path d="M12 3 Q17 9 15.5 13 Q19 12 18 16.5 Q17 21 12 22 Q7 21 6 16.5 Q5 12 8.5 13 Q7 9 12 3 Z" fill="#d4582f"/><path d="M12 12 Q14 15 13.4 17.4 Q15 19.4 12 20.4 Q9 19.4 10.6 17.4 Q10 15 12 12 Z" fill="#f2c94c"/></svg>Spray</span><span class="val">hold click on a fire</span></div>
      <div class="row" style="--d:0.25s"><span class="lab"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="14" height="9" rx="2" fill="#c4372a"/><rect x="16" y="11" width="6" height="6" rx="1.5" fill="#c4372a"/><circle cx="7" cy="18.5" r="2.4" fill="#38251a"/><circle cx="17.5" cy="18.5" r="2.4" fill="#38251a"/><rect x="4" y="10" width="10" height="2.4" fill="#f2e28a"/></svg>Refill</span><span class="val">3× faster near the truck</span></div>
    </div>
  </div>
  <div class="btn-row">
    <button id="start-btn">START SHIFT</button>
  </div>
  <div class="sub2" id="intro-best"></div>
</div>

<script>
/* ================================================================
   HOSED! v2 — fullscreen, canvas particles, meta-progression
   ================================================================ */
const W = 1600, H = 900;
const ROAD_Y = 812;          /* fireman feet line */
const SLOT_W = 148;

/* ---------- META ---------- */
const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const WN_PREFIX = 'HOSEDMETA:';
function loadMeta() {
  let m = {};
  try { m = JSON.parse(store && store.getItem('hosed-meta') || '{}'); } catch (e) {}
  /* fallback: window.name survives reloads even where storage is blocked */
  if (!m || Object.keys(m).length === 0) {
    try {
      if (window.name && window.name.startsWith(WN_PREFIX)) m = JSON.parse(window.name.slice(WN_PREFIX.length));
    } catch (e) {}
  }
  return m || {};
}
let meta = Object.assign({ coins: 0, nozzle: 0, tank: 0, boots: 0, helico: 0, canadair: 0, best: 0, bestDay: 0, career: 0 }, loadMeta());
function saveMeta() {
  try { if (store) store.setItem('hosed-meta', JSON.stringify(meta)); } catch (e) {}
  try { window.name = WN_PREFIX + JSON.stringify(meta); } catch (e) {}
}

/* ---------- CAREER RANKS ---------- */
const RANKS = [
  { at: 0, name: 'ROOKIE' }, { at: 600, name: 'HOSE HANDLER' }, { at: 1800, name: 'FIREFIGHTER' },
  { at: 4000, name: 'LIEUTENANT' }, { at: 8000, name: 'CAPTAIN' }, { at: 14000, name: 'FIRE CHIEF' },
  { at: 25000, name: 'LIVING LEGEND' }
];
function rankFor(c) { let r = RANKS[0]; RANKS.forEach(k => { if (c >= k.at) r = k; }); return r; }
function nextRank(c) { return RANKS.find(k => k.at > c) || null; }

const nozzleDPS  = () => 26 + meta.nozzle * 9;
const tankMax    = () => 100 + meta.tank * 30;
const tankRefill = () => TUNE.refill + meta.tank * 2.5;   /* slow early — truck matters */
const moveSpeed  = () => 420 + meta.boots * 110;
const SPRAY_RANGE = 300;
/* dynamic difficulty: your gear feeds the fire */
const gearLevel = () => meta.nozzle + meta.tank + meta.boots + meta.helico * 2 + meta.canadair * 2;
const diff = () => day + gearLevel() * 0.35;

/* ---------- LIVE TUNING (press T in game) ---------- */
const TUNE = {
  growthBase: 3.6,    /* fire growth per second, base */
  growthPerDiff: 0.5, /* extra growth per difficulty point */
  spawnBase: 7,       /* seconds between new fires, base */
  spreadBase: 5.2,    /* seconds between spreads, base (forests faster) */
  refill: 11,         /* water refill per second, base */
  drain: 25,          /* water drain per second while spraying */
  payMult: 1          /* multiplier on end-of-day pay */
};
const TUNE_DEFS = [
  { k: 'growthBase', label: 'Fire growth', min: 1, max: 9, step: 0.2 },
  { k: 'growthPerDiff', label: 'Growth /difficulty', min: 0, max: 1.5, step: 0.05 },
  { k: 'spawnBase', label: 'Spawn interval', min: 2, max: 12, step: 0.5 },
  { k: 'spreadBase', label: 'Spread interval', min: 2, max: 9, step: 0.2 },
  { k: 'refill', label: 'Water refill', min: 2, max: 20, step: 0.5 },
  { k: 'drain', label: 'Water drain', min: 10, max: 40, step: 1 },
  { k: 'payMult', label: 'Pay multiplier', min: 0.3, max: 2, step: 0.1 }
];
function toggleTuner() {
  let p = document.getElementById('tuner');
  if (p) { p.remove(); return; }
  p = document.createElement('div');
  p.id = 'tuner';

  let html = '<div style="font-size:12px; letter-spacing:2px; margin-bottom:8px; color:#ffd671;">⚙ TUNING (T to close)</div>';
  TUNE_DEFS.forEach(d => {
    html += `<div style="margin-bottom:7px;">
      <div style="display:flex; justify-content:space-between;"><span>${d.label}</span><span id="tv-${d.k}">${TUNE[d.k]}</span></div>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${TUNE[d.k]}" data-k="${d.k}" style="width:100%;">
    </div>`;
  });
  html += '<button id="tune-copy" style="width:100%; font-size:12px; padding:8px;">COPY VALUES</button>';
  p.innerHTML = html;
  document.body.appendChild(p);
  p.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      TUNE[inp.dataset.k] = parseFloat(inp.value);
      document.getElementById('tv-' + inp.dataset.k).textContent = inp.value;
    });
  });
  p.querySelector('#tune-copy').addEventListener('click', () => {
    const txt = JSON.stringify(TUNE, null, 1);
    try { navigator.clipboard.writeText(txt); } catch (e) {}
    p.querySelector('#tune-copy').textContent = 'COPIED ✓';
  });
}

const disp = { score: 0, coins: 0 };
function tween(id, to) {
  const el = document.getElementById(id);
  const from = disp[id];
  disp[id] = to;
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 500;
  (function f(t) {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

/* ================================================================
   PARTICLES (canvas)
   ================================================================ */
const P = { fire: [], smoke: [], water: [], ember: [], rain: [] };
function emitFire(s, dt) {
  const ratio = s.fire / TYPE_INFO[s.type].hp;
  const n = Math.min(6, Math.ceil(ratio * 46 * dt));
  const top = slotTopY(s);
  for (let k = 0; k < n; k++) {
    if (P.fire.length > 360) break;
    P.fire.push({
      x: s.x + 14 + Math.random() * (SLOT_W - 28),
      y: top + 46 + Math.random() * 90 * (1 - ratio * 0.4),
      vx: (Math.random() - 0.5) * 18,
      vy: -(48 + Math.random() * 95) * (0.55 + ratio * 0.75),
      r: 7 + Math.random() * 15 * (0.5 + ratio),
      life: 1, decay: 1.5 + Math.random() * 1.4
    });
  }
  if (Math.random() < dt * 6 && P.smoke.length < 130) {
    P.smoke.push({
      x: s.x + 20 + Math.random() * (SLOT_W - 40),
      y: top + 30, vx: 8 + Math.random() * 12, vy: -(30 + Math.random() * 26),
      r: 12 + Math.random() * 16, life: 1, decay: 0.4 + Math.random() * 0.25
    });
  }
}
function emitWater(x0, y0, x1, y1) {
  for (let k = 0; k < 7; k++) {
    if (P.water.length > 260) break;
    const t = Math.random();
    const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 130;
    const px = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
    const py = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
    P.water.push({ x: px, y: py, vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 60,
      r: 2.2 + Math.random() * 3, life: 0.6 + Math.random() * 0.3, decay: 1.8 });
  }
}
function emitEmbers(s) {
  const top = slotTopY(s);
  for (let k = 0; k < 42; k++) {
    P.ember.push({
      x: s.x + 20 + Math.random() * (SLOT_W - 40), y: top + 60 + Math.random() * 60,
      vx: (Math.random() - 0.5) * 220, vy: -(60 + Math.random() * 220),
      r: 1.6 + Math.random() * 2.8, life: 1, decay: 0.8 + Math.random() * 0.7
    });
  }
}
function stepParticles(dt) {
  const g = 460;
  ['fire', 'smoke', 'water', 'ember'].forEach(key => {
    const arr = P[key];
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= p.decay * dt;
      if (p.life <= 0) { arr.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (key === 'water' || key === 'ember') p.vy += g * dt;
      if (key === 'smoke') { p.r += 14 * dt; p.vx += 6 * dt; }
      if (key === 'fire') p.r *= (1 - 1.1 * dt);
    }
  });
  if (raining > 0) {
    for (let k = 0; k < 6; k++) {
      if (P.rain.length > 180) break;
      P.rain.push({ x: Math.random() * (W + 200) - 100, y: -20, vx: -60, vy: 780, life: 1.4, decay: 0.8 });
    }
  }
  for (let i = P.rain.length - 1; i >= 0; i--) {
    const p = P.rain[i];
    p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.life -= 0.016;
    if (p.y > ROAD_Y || p.life <= 0) P.rain.splice(i, 1);
  }
}
function drawParticles() {
  ctx.clearRect(0, 0, W, H);
  /* warm flicker glow behind burning buildings */
  ctx.globalCompositeOperation = 'lighter';
  const tNow = performance.now() / 1000;
  slots.forEach(s => {
    if (!s.burning) return;
    const ratio = Math.min(1, s.fire / TYPE_INFO[s.type].hp);
    const flick = 0.75 + 0.25 * Math.sin(tNow * 11 + s.i * 2.4);
    const r = (70 + ratio * 130) * flick;
    const gx = s.x + SLOT_W / 2, gy = slotTopY(s) + 90;
    const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
    grd.addColorStop(0, `rgba(255,150,60,${0.16 + ratio * 0.14})`);
    grd.addColorStop(1, 'rgba(255,100,30,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(gx, gy, r, 0, 7); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  /* smoke first */
  P.smoke.forEach(p => {
    ctx.globalAlpha = Math.min(0.5, p.life * 0.5);
    ctx.fillStyle = '#5a5a5e';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  /* fire additive */
  ctx.globalCompositeOperation = 'lighter';
  P.fire.forEach(p => {
    const a = Math.max(0, p.life);
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grd.addColorStop(0, `rgba(255,236,150,${0.85 * a})`);
    grd.addColorStop(0.4, `rgba(255,150,50,${0.6 * a})`);
    grd.addColorStop(1, 'rgba(200,40,10,0)');
    ctx.fillStyle = grd;
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  P.ember.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  /* water */
  P.water.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life) * 0.85;
    ctx.fillStyle = '#8fd0f2';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  });
  /* rain */
  ctx.strokeStyle = 'rgba(160,205,235,0.5)';
  ctx.lineWidth = 2;
  P.rain.forEach(p => {
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 5, p.y + 16); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function destroySlot(s) {

  }
  popAt(s.x + SLOT_W / 2, slotTopY(s), s.type === 'trees' ? 'FOREST LOST' : 'DESTROYED…');

function pickMission() {
  const opts = [];
  const churches = slots.filter(s => s.type === 'church' && !s.ruined);
  const bakeries = slots.filter(s => s.type === 'bakery' && !s.ruined);
  if (churches.length) opts.push({ id: 'protect', target: churches[0].i, label: 'Protect the church', reward: 10 });
  if (bakeries.length) opts.push({ id: 'protect', target: bakeries[0].i, label: 'Protect the bakery', reward: 10 });
  if (slots.some(s => s.type === 'trees' && !s.ruined)) opts.push({ id: 'noforest', label: 'Lose no forest', reward: 8 });
  opts.push({ id: 'ext', need: 4 + Math.floor(day / 2), label: 'Put out ' + (4 + Math.floor(day / 2)) + ' fires', reward: 7 });
  opts.push({ id: 'water', label: 'End with 50%+ water', reward: 7 });
  return opts[Math.floor(Math.random() * opts.length)];
}
function missionSuccess() {
  if (!mission) return false;
  if (mission.id === 'protect') return !slots[mission.target].ruined;
  if (mission.id === 'noforest') return !forestLostToday;
  if (mission.id === 'ext') return extToday >= mission.need;
  if (mission.id === 'water') return water >= tankMax() * 0.5;
  return false;
}

function dropSplash(x, w) {

}
function useHelico() {
  if (!playing || airBusy || helicoUses <= 0) return;
  const burning = slots.filter(s => s.burning).sort((a, b) => b.fire - a.fire);
  if (!burning.length) return;
  helicoUses--; airBusy = true; renderAirBtns();

    [slots[target.i - 1], slots[target.i + 1]].forEach(n => { if (n && n.burning) n.fire = Math.max(2, n.fire - 55); });
    setTimeout(() => {
      air.style.transition = 'left 1.1s ease, top 1.1s ease';

function useCanadair() {

/* ================================================================
   MAIN LOOP
   ================================================================ */
let lastT = 0;
function loop(t) {
  if (!playing) return;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  /* fireman movement */
  const targetX = Math.max(60, Math.min(W - 120, pointer.x - 45));
  const dx = targetX - fireman.x;
  const step = moveSpeed() * dt;
  let moving = false;
  if (Math.abs(dx) > 4) {
    moving = true;
    fireman.x += Math.sign(dx) * Math.min(step, Math.abs(dx));
    fireman.dir = Math.sign(dx) || fireman.dir;
    fireman.frameT += dt;
    if (fireman.frameT > 0.11) { fireman.frame = 1 - fireman.frame; fireman.frameT = 0; }
  }
  const dogTarget = fireman.x - 70 * fireman.dir;
  dog.x += (dogTarget - dog.x) * Math.min(1, dt * 3);

  /* aim: building under pointer, within range of fireman */
  const aimSlot = slots.find(s => s.burning && pointer.x > s.x - 8 && pointer.x < s.x + SLOT_W + 8
    && Math.abs((s.x + SLOT_W / 2) - (fireman.x + 45)) < SPRAY_RANGE);
  const spraying = pointer.down && water > 0.5 && !!aimSlot;
  if (spraying) {
    water = Math.max(0, water - TUNE.drain * dt);
    aimSlot.fire -= nozzleDPS() * dt;
    emitWater(pointer.x, pointer.y, aimSlot.x + SLOT_W / 2, slotTopY(aimSlot) + 70);
    if (aimSlot.fire <= 0) extinguishSlot(aimSlot);
  } else {
    const nearTruck = fireman.x < 260;
    water = Math.min(tankMax(), water + tankRefill() * (nearTruck ? 3 : 1) * dt);
    document.getElementById('refill-hint').textContent =
      (water < tankMax() * 0.99 && nearTruck) ? '⚡ FAST REFILL (truck)' : '';
  }
  if (spraying) document.getElementById('refill-hint').textContent = '';

  /* fire growth / spread */
  slots.forEach(s => {
    if (!s.burning) return;
    const growth = (TUNE.growthBase + diff() * TUNE.growthPerDiff) * (s.type === 'trees' ? 1.6 : 1) * (raining > 0 ? 0.25 : 1);
    s.fire += growth * dt;
    if (raining > 0) s.fire -= 6 * dt;
    if (s.fire <= 0) { extinguishSlot(s); return; }
    if (s.fire >= slotHP(s)) { destroySlot(s); return; }
    emitFire(s, dt);
    s.spreadT += dt;
    const spreadEvery = (s.type === 'trees' ? TUNE.spreadBase * 0.62 : TUNE.spreadBase) - Math.min(2.8, diff() * 0.24);
    if (s.fire > slotHP(s) * 0.45 && s.spreadT > spreadEvery) {
      s.spreadT = 0;
      const n = Math.random() < 0.5 ? slots[s.i - 1] : slots[s.i + 1];
      if (n && !n.ruined && !n.burning) igniteSlot(n);
    }
  });

  /* ignition scheduler */
  if (ignitionsLeft > 0) {
    igniteTimer -= dt;
    if (igniteTimer <= 0) {
      const candidates = slots.filter(s => !s.ruined && !s.burning);
      if (candidates.length) {
        igniteSlot(candidates[Math.floor(Math.random() * candidates.length)]);
        ignitionsLeft--;
        igniteTimer = Math.max(1.8, TUNE.spawnBase - diff() * 0.45) * (0.6 + Math.random() * 0.8);
      }
    }
  }

  /* rain */
  if (raining > 0) {
    raining -= dt;
  } else {
    rainCooldown -= dt;
    if (rainCooldown <= 0) {
      rainCooldown = 30 + Math.random() * 30;
      if (Math.random() < 0.35 && slots.some(s => s.burning)) {
        raining = 7;
        showTitle('RAIN!', 'blue');
      }
    }
  }

  if (combo > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) { combo = 0; refreshHud(); }
  }

  if (!dayDone && ignitionsLeft === 0 && !slots.some(s => s.burning)) {
    dayDone = true;
    setTimeout(endDay, 700);
  }

  /* clouds drift */
  cloudEls.forEach(c => {
    c.x += c.v * dt;
    if (c.x > W + 60) c.x = -180;
    c.el.style.left = c.x + 'px';
  });

  stepParticles(dt);
  drawFrame(spraying, aimSlot, moving);
  requestAnimationFrame(loop);
}

function drawFrame(spraying, aimSlot, moving) {
  const fm = document.getElementById('fireman');
  fm.style.left = fireman.x + 'px';
  const aimUp = spraying && aimSlot && slotTopY(aimSlot) < 640;
  fm.innerHTML = firemanSVG(moving ? fireman.frame : 0, spraying, aimUp);
  fm.style.transform = fireman.dir < 0 ? 'scaleX(-1)' : '';
  const dg = document.getElementById('dog');
  dg.style.left = dog.x + 'px';
  dg.innerHTML = dogSVG(moving ? fireman.frame : 0);
  dg.style.transform = (fireman.x - dog.x) < 0 ? 'scaleX(-1)' : '';

  slots.forEach(s => {
    const el = document.getElementById('slot-' + s.i);
    if (!s.burning) return;
    const ratio = Math.min(1, s.fire / slotHP(s));
    el.querySelector('.hp-bar i').style.width = (ratio * 100) + '%';
    el.querySelector('.char').style.opacity = ratio * 0.55;
    el.querySelector('.bld svg').style.filter = `saturate(${1 - ratio * 0.3}) brightness(${1 - ratio * 0.22})`;
  });

  drawParticles();

  /* hose from fireman to the nozzle cursor (always while playing) */
  const noz = document.getElementById('nozzle-cur');
  if (playing && noz) {
    noz.style.display = 'block';
    const hx0 = fireman.x + 45, hy0 = ROAD_Y - 44;
    const angle = Math.atan2(pointer.y - hy0, pointer.x - hx0);
    noz.style.left = (pointer.x - 19) + 'px';
    noz.style.top = (pointer.y - 15) + 'px';
    noz.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
    /* sagging hose */
    const mx = (hx0 + pointer.x) / 2, my = Math.max(hy0, pointer.y) + 70;
    ctx.strokeStyle = '#8c3626';
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx0, hy0); ctx.quadraticCurveTo(mx, my, pointer.x, pointer.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx0, hy0); ctx.quadraticCurveTo(mx, my, pointer.x, pointer.y); ctx.stroke();
    /* water burst from the nozzle when spraying */
    if (spraying && aimSlot) {
      const x1 = aimSlot.x + SLOT_W / 2, y1 = slotTopY(aimSlot) + 70;
      ctx.strokeStyle = 'rgba(110,180,230,0.8)';
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(pointer.x, pointer.y); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = 'rgba(220,240,250,0.65)';
      ctx.lineWidth = 3.5;
      ctx.setLineDash([12, 14]);
      ctx.lineDashOffset = -performance.now() / 2.5;
      ctx.beginPath(); ctx.moveTo(pointer.x, pointer.y); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.setLineDash([]);
    }
  } else if (noz) noz.style.display = 'none';

  const bar = document.getElementById('water-bar');
  bar.querySelector('i').style.width = (water / tankMax() * 100) + '%';
  bar.classList.toggle('low', water < tankMax() * 0.25);
  document.getElementById('water-pct').textContent = Math.round(water / tankMax() * 100) + '%';
}

function startDay() {
  hideOverlays();
  playing = true; dayDone = false;
  applyDaytime();
  water = tankMax(); combo = 0;
  helicoUses = meta.helico; canadairUses = meta.canadair;
  raining = 0; rainCooldown = 14 + Math.random() * 14;
  /* nothing regrows for free anymore — replant & rebuild are in the shop */
  renderAirBtns();
  /* daily mission */
  extToday = 0; forestLostToday = false;
  mission = pickMission();
  const mu = document.getElementById('mission-ui');
  mu.innerHTML = '<span style="color:#8b95a8; letter-spacing:2px; font-size:10.5px;">MISSION</span>&nbsp; ' +
    mission.label + ' &nbsp;<span style="color:var(--gold);">+' + mission.reward + ' ' + coinMini() + '</span>';
  mu.classList.remove('hidden');
  /* cat in danger (40% of days, in a building) */
  catSlot = -1;
  document.querySelectorAll('.cat').forEach(c => c.remove());
  if (Math.random() < 0.4) {
    const houses = slots.filter(s => !s.ruined && s.type !== 'trees');
    if (houses.length) {
      const cs = houses[Math.floor(Math.random() * houses.length)];
      catSlot = cs.i;
      const el = document.getElementById('slot-' + cs.i);
      el.insertAdjacentHTML('beforeend',
        `<div class="cat" style="position:absolute; top:34%; left:60%; width:30px; z-index:5; animation: badgepulse 1.4s ease-in-out infinite;">${catSVG()}</div>`);
    }
  }
  const initial = day === 1 ? 1 : Math.min(1 + Math.floor(diff() / 4), 3);
  ignitionsLeft = 2 + Math.ceil(day * 0.9) + Math.floor(gearLevel() / 3);
  igniteTimer = 1.5;
  for (let k = 0; k < initial && ignitionsLeft > 0; k++) {
    const candidates = slots.filter(s => !s.ruined && !s.burning);
    if (candidates.length) { igniteSlot(candidates[Math.floor(Math.random() * candidates.length)]); ignitionsLeft--; }
  }
  showTitle('DAY ' + day, day % 5 === 0 ? 'gold' : '');
  setMsg(day === 1
    ? 'Point at a fire and <span class="hl">hold to spray</span>. Refill near the truck!'
    : `Day ${day} — ${DAYTIMES[(day - 1) % 3].name === 'dusk' ? 'evening shift. ' : ''}The fires burn hotter.`);
  refreshHud();
  lastT = 0;
  requestAnimationFrame(loop);
}

function endDay() {
  playing = false;
  ctx.clearRect(0, 0, W, H);
  Object.keys(P).forEach(k => P[k] = []);
  document.getElementById('mission-ui').classList.add('hidden');
  const standing = slots.filter(s => !s.ruined).length;
  const bonus = standing * 5 * day;
  score += bonus;
  let coinsEarned = Math.round((5 + day * 2.5 + standing) * TUNE.payMult);
  /* mission result */
  const mOK = missionSuccess();
  if (mOK) coinsEarned += mission.reward;
  /* supply drop every 3 days (variable jackpot) */
  let chest = 0;
  if (day % 3 === 0) {
    chest = 8 + Math.floor(Math.random() * 22);
    coinsEarned += chest;
  }
  meta.coins += coinsEarned;
  const perfect = slots.every(s => !s.ruined);
  if (score > meta.best) meta.best = score;
  if (day > meta.bestDay) meta.bestDay = day;
  /* career rank progression */
  const prevRank = rankFor(meta.career);
  meta.career += bonus + extToday * 10 * day;
  const newRank = rankFor(meta.career);
  saveMeta();
  refreshHud();
  if (perfect) showTitle('PERFECT DAY!', 'gold', true);
  if (newRank !== prevRank) setTimeout(() => showTitle('PROMOTED!<br>' + newRank.name, 'gold', true), perfect ? 2100 : 300);

  const nr = nextRank(meta.career);
  const curR = newRank;
  const rankPct = nr ? Math.round(((meta.career - curR.at) / (nr.at - curR.at)) * 100) : 100;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <h1>DAY ${day} <span class="fire">SURVIVED</span></h1>
    <div class="card">
      <div class="head">SHIFT REPORT</div>
      ${perfect ? '<div class="stamp">PERFECT!</div>' : ''}
      <div class="body">
        <div class="row" style="--d:0.15s"><span class="lab">Buildings saved</span><span class="val ${perfect ? 'good' : ''}">${standing} / ${slots.length}</span></div>
        <div class="row" style="--d:0.35s"><span class="lab">Survival bonus</span><span class="val">+${bonus} pts</span></div>
        <div class="row" style="--d:0.55s"><span class="lab">Pay</span><span class="val gold">${coinIcon()} +<span id="pay-val">0</span></span></div>
        <div class="row" style="--d:0.75s"><span class="lab">Mission</span><span class="val ${mOK ? 'good' : 'bad'}">${mission.label} ${mOK ? '✓' : '✗'}</span></div>
        ${chest ? `<div class="row" style="--d:0.95s"><span class="lab">Supply drop</span><span class="val gold">${coinIcon()} +${chest}</span></div>` : ''}
        <div class="row" style="--d:${chest ? 1.15 : 0.95}s; display:block;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="lab">Rank — ${curR.name}</span>
            <span class="lab" style="color:#c9b590;">${nr ? nr.name : 'MAX'}</span>
          </div>
          <div class="rankbar"><i id="rank-fill" style="width:0%"></i></div>
        </div>
        ${perfect ? '<div class="flavor">Not a scratch. The mayor loves you.</div>' : ''}
      </div>
    </div>
    <div id="shop-grid"></div>
    <button id="next-day-btn">NEXT DAY →</button>`;
  document.body.appendChild(ov);
  renderShopGrid(ov.querySelector('#shop-grid'));
  ov.querySelector('#next-day-btn').addEventListener('click', () => { day++; startDay(); });
  /* casino payout: pay counts up + coin rain + rank bar fills */
  const payEl = ov.querySelector('#pay-val');
  const t0 = performance.now();
  (function payTick(t) {
    const p = Math.min(1, (t - t0 - 700) / 900);
    if (p > 0) payEl.textContent = Math.round(coinsEarned * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(payTick);
  })(t0);
  setTimeout(() => { const rf = ov.querySelector('#rank-fill'); if (rf) rf.style.width = rankPct + '%'; }, chest ? 1300 : 1100);
  setTimeout(() => coinRain(Math.min(26, 8 + coinsEarned)), 650);
}

function restartRun() {
  /* fresh run — EVERYTHING resets (only records survive) */
  hideOverlays();
  Object.keys(P).forEach(k => P[k] = []);
  meta.coins = 0; meta.nozzle = 0; meta.tank = 0; meta.boots = 0;

    buy: rebuildBuilding, done: 'BUILDING REBUILT!', desc: 'Rebuild one ruined building' }
];
function renderShopGrid(el) {
  el.innerHTML = '';
  UPGRADES.forEach(u => {
    const isCustom = u.max === 0;
    const lvl = isCustom ? 0 : meta[u.id];
    const maxed = isCustom ? u.soldout() : lvl >= u.max;
    const cost = u.cost(lvl);
    const afford = meta.coins >= cost;
    const d = document.createElement('div');
    d.className = 'up-card' + ((maxed || !afford) ? ' disabled' : '');
    let pips = '';
    for (let k = 0; k < u.max; k++) pips += `<i class="${k < lvl ? 'on' : ''}"></i>`;
    d.title = u.desc;
    d.innerHTML = `<div class="ico">${u.icon()}</div><div class="nm">${u.name}</div>
      ${u.max ? `<div class="pips">${pips}</div>` : ''}
      <div class="cost ${maxed ? 'max' : ''}">${maxed ? (isCustom ? '—' : 'MAX') : coinIcon() + ' ' + cost}</div>`;
    d.addEventListener('click', () => {
      if (maxed || meta.coins < cost) return;
      meta.coins -= cost;
      if (isCustom) {
        u.buy();
        showTitle(u.done, 'gold', true);
      } else {
        meta[u.id]++;
        showTitle(u.name + (meta[u.id] > 1 ? ' LV.' + meta[u.id] : '') + '!', 'gold', true);
      }
      saveMeta();
      refreshHud();
      renderShopGrid(el);
    });
    el.appendChild(d);
  });
}

/* ---------- storage health + save codes ---------- */
function storageOK() {
  try { store.setItem('hosed-test', '1'); const ok = store.getItem('hosed-test') === '1'; store.removeItem('hosed-test'); return ok; }
  catch (e) { return false; }
}
function saveCode() { return btoa(JSON.stringify(meta)); }
function loadCode(code) {
  try {
    const m = JSON.parse(atob(code.trim()));
    if (typeof m.coins !== 'number') return false;
    meta = Object.assign({ coins: 0, nozzle: 0, tank: 0, boots: 0, helico: 0, canadair: 0, best: 0, bestDay: 0, career: 0 }, m);
    saveMeta();
    return true;
  } catch (e) { return false; }
}

function showIntroShop() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <h1>FIRE <span class="fire">STATION</span></h1>
    <div class="panel">Spend your coins on gear for this run.</div>
    <div id="shop-grid"></div>
    <div class="panel" style="font-size:12.5px; max-width:560px;">
      💾 SAVE CODE (copy it somewhere safe):<br>
      <input id="save-code" readonly value="${saveCode()}"
        style="width:100%; margin:6px 0; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.35); color:#f7efdd; font-size:11px; font-family:monospace;">
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button id="copy-code" class="blue" style="font-size:12px; padding:8px 16px;">COPY</button>
        <button id="load-code" class="blue" style="font-size:12px; padding:8px 16px;">LOAD A CODE</button>
      </div>
    </div>
    <button id="back-btn" class="blue">BACK</button>`;
  document.body.appendChild(ov);
  renderShopGrid(ov.querySelector('#shop-grid'));
  ov.querySelector('#back-btn').addEventListener('click', () => ov.remove());
  ov.querySelector('#copy-code').addEventListener('click', () => {
    const inp = ov.querySelector('#save-code');
    inp.select();
    try { navigator.clipboard.writeText(inp.value); } catch (e) { document.execCommand('copy'); }
    ov.querySelector('#copy-code').textContent = 'COPIED ✓';
  });
  ov.querySelector('#load-code').addEventListener('click', () => {
    const code = prompt('Paste your save code:');
    if (code && loadCode(code)) {
      refreshHud();
      renderShopGrid(ov.querySelector('#shop-grid'));
      ov.querySelector('#save-code').value = saveCode();
      showTitle('SAVE LOADED!', 'gold', true);
      document.getElementById('intro-best').textContent = introBestText();
    } else if (code) alert('Invalid code.');
  });
}
function introBestText() {
  return meta.best > 0 ? `Best: ${meta.best} pts — Day ${meta.bestDay}` : '';
}
document.getElementById('intro-best').textContent = introBestText();
document.getElementById('start-btn').addEventListener('click', restartRun);

/* ---------- ATTRACT MODE (live demo behind the title screen) ---------- */
let demoOn = false, demoLast = 0, demoFrameT = 0;
function startDemo() {
  demoOn = true;
  [slots[3], slots[7]].forEach(s => { s.burning = true; s.fire = 55; });
  requestAnimationFrame(demoLoop);
}
function demoLoop(t) {
  if (!demoOn) return;
  const dt = Math.min(0.05, (t - demoLast) / 1000 || 0.016);
  demoLast = t;
  const tt = t / 1000;
  /* fires breathe but never spread or destroy */
  slots.forEach(s => {
    if (!s.burning) return;
    s.fire = 55 + 18 * Math.sin(tt * 1.3 + s.i * 2);
    emitFire(s, dt);
  });
  /* fireman patrols with the dog */
  const px = 700 + 300 * Math.sin(tt * 0.33);
  fireman.dir = Math.cos(tt * 0.33) >= 0 ? 1 : -1;
  fireman.x = px;
  demoFrameT += dt;
  if (demoFrameT > 0.13) { fireman.frame = 1 - fireman.frame; demoFrameT = 0; }
  dog.x += ((fireman.x - 70 * fireman.dir) - dog.x) * Math.min(1, dt * 3);
  cloudEls.forEach(c => {
    c.x += c.v * dt;
    if (c.x > W + 60) c.x = -180;
    c.el.style.left = c.x + 'px';
  });
  stepParticles(dt);
  drawFrame(false, null, true);
  requestAnimationFrame(demoLoop);
}
const _origRestart = restartRun;
restartRun = function() {
  demoOn = false;
  Object.keys(P).forEach(k => P[k] = []);
  _origRestart();
};
document.getElementById('start-btn').removeEventListener('click', _origRestart);
document.getElementById('start-btn').addEventListener('click', restartRun);

buildScene();
refreshHud();
startDemo();
</script>
</body>
