<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOO.F.O — Save your herd</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7efdd;
    --wood-hi: #8a6238;
    --wood-lo: #6e4c2a;
    --wood-edge: #4e3419;
    --title-font: 'Lilita One', cursive;
    --body-font: 'Nunito', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--body-font);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 10px; overflow: hidden; user-select: none;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,244,190,0.35), transparent 34%),
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08), transparent 60%),
      linear-gradient(160deg, #6ba04a 0%, #578b3b 40%, #4a7c33 100%);
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(20,35,15,0.35) 100%);
  }

  .wood {
    background: linear-gradient(180deg, var(--wood-hi), var(--wood-lo));
    border: 3px solid var(--wood-edge);
    box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.15);
  }

  /* ---------- HUD (simple: 3 stats) ---------- */
  #hud { display: flex; align-items: center; border-radius: 14px; overflow: hidden; }
  #hud .slot { display: flex; align-items: center; gap: 8px; padding: 9px 18px; }
  #hud .slot + .slot { border-left: 2px solid rgba(0,0,0,0.25); }
  #hud .slot svg { width: 21px; height: 21px; }
  #hud .val { font-family: var(--title-font); font-size: 21px; color: var(--cream); text-shadow: 0 2px 0 rgba(0,0,0,0.3); min-width: 30px; }
  #streak-badge {
    font-family: var(--title-font); font-size: 13px; letter-spacing: 1px;
    color: #2f1c0c; background: linear-gradient(180deg, #ffd671, #eda93c);
    border: 2px solid #a86f1e; border-radius: 999px; padding: 4px 14px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    animation: badgepulse 1.4s ease-in-out infinite;
  }
  @keyframes badgepulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  #field-frame {
    padding: 12px; border-radius: 16px; position: relative;
    background:
      repeating-linear-gradient(90deg, #8a6238 0px, #96703f 26px, #8a6238 52px),
      #8a6238;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4), inset 0 0 0 3px var(--wood-edge);
  }
  #field-frame.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-4px,2px); }
    50% { transform: translate(3px,-2px); }
    75% { transform: translate(-2px,1px); }
  }
  #field {
    position: relative;
    width: var(--fs); height: var(--fs);
    border-radius: 6px; overflow: hidden;
    background: linear-gradient(160deg, #61914a 0%, #55853e 50%, #4d7b37 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  }
  .cell { position: absolute; width: var(--cs); height: var(--cs); cursor: pointer; touch-action: none; }
  .cell.alt { background: rgba(255,255,255,0.04); }
  .cell.placable:hover { box-shadow: inset 0 0 0 3px rgba(247,239,221,0.75); border-radius: 6px; }
  .cell.buildable:hover { box-shadow: inset 0 0 0 3px rgba(255,214,113,0.9); border-radius: 6px; }
  .cell.drop-ok { box-shadow: inset 0 0 0 3px rgba(159,220,126,0.95); border-radius: 6px; }
  .cell.hazard::after {
    content: ''; position: absolute; inset: 2px; border-radius: 4px;
    border: 3px dashed rgba(255,90,60,0.75); pointer-events: none;
    animation: hazardblink 1s steps(1) infinite;
  }
  @keyframes hazardblink { 50% { opacity: 0.25; } }
  .deco { position: absolute; pointer-events: none; }

  .cow-wrap { position: absolute; inset: 5%; pointer-events: none; z-index: 3; }
  .cow-wrap svg { animation: idle 3.4s ease-in-out infinite; }
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(2deg); } }
  .shed-wrap, .burnt-wrap, .circle-wrap, .scare-wrap, .crate-wrap { position: absolute; inset: 3%; pointer-events: none; z-index: 2; }
  .scare-wrap { inset: 8%; z-index: 3; }
  .crate-wrap { inset: 10%; z-index: 3; animation: cratebob 1.6s ease-in-out infinite; }
  @keyframes cratebob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  .circle-wrap { inset: 8%; z-index: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }

  .moo-bubble {
    position: absolute; top: -12px; left: 60%; z-index: 5;
    background: var(--cream); color: #5e4126; font-weight: 800; font-size: 11px;
    padding: 3px 8px; border-radius: 8px; border: 2px solid #b9a888;
    animation: moo 1.4s forwards; pointer-events: none; white-space: nowrap;
  }
  @keyframes moo { 0% { opacity: 0; transform: translateY(4px); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

  .milk-pop {
    position: absolute; left: 50%; top: 20%; transform: translateX(-50%); z-index: 7;
    font-weight: 800; font-size: 14px; color: #ffffff;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    animation: milkpop 1.1s forwards; pointer-events: none; white-space: nowrap;
  }
  @keyframes milkpop {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
    25% { opacity: 1; transform: translate(-50%, -6px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }

  .wave-banner {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .wave-banner span {
    font-family: var(--title-font); font-size: clamp(18px, 4vw, 26px);
    color: var(--cream); text-shadow: 0 3px 0 rgba(0,0,0,0.45);
    background: rgba(30, 48, 26, 0.85); padding: 12px 22px; border-radius: 12px;
    border: 3px solid rgba(247,239,221,0.35);
    animation: bannerpop 1.5s forwards; text-align: center;
  }
  @keyframes bannerpop {
    0% { opacity: 0; transform: scale(0.6); }
    18% { opacity: 1; transform: scale(1.06); }
    28% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.02); }
  }

  /* ---------- BIG TITLE CARDS (casino style) ---------- */
  #title-card {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #title-card .burst {
    position: absolute; width: 340px; height: 340px; opacity: 0.55;
    animation: burstspin 1.9s linear forwards;
  }
  @keyframes burstspin { 0% { transform: rotate(0deg) scale(0.5); opacity: 0; } 15% { opacity: 0.55; } 85% { opacity: 0.55; } 100% { transform: rotate(40deg) scale(1.1); opacity: 0; } }
  #title-card .tc {
    font-family: var(--title-font); font-size: clamp(34px, 8vw, 62px);
    color: var(--cream); text-align: center; line-height: 1.15;
    text-shadow: 0 3px 0 #4e3419, 0 6px 14px rgba(0,0,0,0.5);
    animation: tcpop 1.9s forwards;
  }
  #title-card .tc.gold { color: #ffd671; }
  #title-card .tc.red { color: #ff9a7a; }
  @keyframes tcpop {
    0% { opacity: 0; transform: scale(0.4) rotate(-4deg); }
    14% { opacity: 1; transform: scale(1.12) rotate(1.5deg); }
    24% { transform: scale(1) rotate(0deg); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* ---------- LUCKY WHEEL ---------- */
  #wheel-overlay {
    position: fixed; inset: 0; z-index: 70;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(8, 14, 6, 0.78);
  }
  #wheel-title {
    font-family: var(--title-font); font-size: clamp(26px, 6vw, 40px);
    color: #ffd671; text-shadow: 0 3px 0 rgba(0,0,0,0.5);
    animation: badgepulse 1.4s ease-in-out infinite;
  }
  #wheel-box { position: relative; width: min(74vw, 300px); }
  #wheel-svg { width: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(0,0,0,0.5)); }
  #wheel-rotor { transform-origin: 150px 150px; }
  #wheel-pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 40px; z-index: 2;
  }
  .beam-flash {
    position: absolute; inset: -6%; z-index: 4; pointer-events: none;
    background: radial-gradient(circle, rgba(190,255,170,0.95) 0%, rgba(190,255,170,0.35) 55%, transparent 75%);
    animation: flash 0.5s forwards; border-radius: 50%;
  }
  .beam-col {
    position: absolute; left: 22%; right: 22%; top: -85%; bottom: 45%;
    z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, rgba(190,255,170,0.05), rgba(190,255,170,0.6));
    clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
    animation: flash 0.5s forwards;
  }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
  .abduct { animation: abduct 0.7s forwards; }
  @keyframes abduct {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-70px) scale(0.4) rotate(40deg); opacity: 0; }
  }
  .burn { animation: burn 0.6s forwards; }
  @keyframes burn { 0% { opacity: 1; } 100% { opacity: 0; transform: scale(0.85); } }

  #ufo, #mothership {
    position: absolute; z-index: 6; pointer-events: none; opacity: 0;
    transition: left 0.22s ease, top 0.22s ease, opacity 0.4s;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }
  #ufo { width: calc(var(--cs) * 1.35); }
  #mothership { width: calc(var(--cs) * 2.2); transition: left 0.09s linear, top 0.09s linear, opacity 0.4s; }

  #drag-ghost {
    position: fixed; width: 44px; height: 44px; z-index: 100;
    pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
    transform: translate(-50%, -60%) scale(1.15);
  }

  #tray { display: flex; gap: 6px; align-items: center; min-height: 42px; padding: 5px 14px; border-radius: 10px; }
  #tray .label { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #d9c39a; }
  #tray .tray-cow { width: 32px; height: 32px; cursor: grab; touch-action: none; }
  #tray .tray-cow svg { pointer-events: none; }

  #shop { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
  .shop-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border-radius: 10px; padding: 6px 10px; cursor: pointer; min-width: 74px;
    transition: transform 0.08s;
  }
  .shop-item:hover { transform: translateY(-2px); }
  .shop-item.disabled { opacity: 0.45; cursor: not-allowed; }
  .shop-item.selected { outline: 3px solid #ffd671; }
  .shop-item .ico { width: 32px; height: 32px; }
  .shop-item .ico svg { width: 100%; height: 100%; }
  .shop-item .nm { font-size: 10px; font-weight: 800; color: var(--cream); letter-spacing: 0.5px; }
  .shop-item .cost { font-size: 11px; font-weight: 800; color: #cfe3ff; }
  .shop-item .lock { font-size: 9px; font-weight: 800; color: #d9c39a; }

  #msg {
    font-size: 13.5px; font-weight: 800; color: var(--cream); text-align: center;
    line-height: 1.45; min-height: 38px; max-width: min(94vw, 620px);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  #msg .hl { color: #ffd671; }
  #msg .warn { color: #ffab7a; }
  button {
    font-family: var(--title-font); font-size: 16px; letter-spacing: 1px; cursor: pointer;
    padding: 12px 26px; border-radius: 12px; color: var(--cream);
    background: linear-gradient(180deg, #b3502e, #933f22);
    border: 3px solid #6e2e18;
    box-shadow: 0 4px 0 #5c2614, 0 6px 12px rgba(0,0,0,0.3);
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #5c2614; }

  #overlay {
    position: fixed; inset: 0; z-index: 80;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 20px;
    background:
      radial-gradient(circle at 70% 25%, rgba(190,255,170,0.12), transparent 40%),
      linear-gradient(180deg, #101c38 0%, #223a5e 70%, #2f4d34 100%);
  }
  #overlay h1 {
    font-family: var(--title-font); font-size: clamp(38px, 9vw, 60px);
    color: var(--cream); text-shadow: 0 4px 0 rgba(0,0,0,0.35); line-height: 1.1;
  }
  #overlay h1 .green { color: #9fdc7e; }
  #overlay .panel {
    border-radius: 14px; padding: 16px 24px; max-width: 480px;
    color: var(--cream); font-size: 15px; font-weight: 800; line-height: 1.65;
  }
  #overlay .panel .hl { color: #ffd671; }
  #overlay .score-big { font-family: var(--title-font); font-size: 38px; color: #ffd671; text-shadow: 0 3px 0 rgba(0,0,0,0.4); }
  #overlay .best { font-size: 13px; font-weight: 800; color: #9fdc7e; letter-spacing: 1px; }
  #overlay .ufo-hero { width: 130px; animation: hover 2.4s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(190,255,170,0.45)); }
  @keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 26vh; pointer-events: none; z-index: 0; }
  #overlay > *:not(.stars):not(.hills) { position: relative; z-index: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="hud" class="wood">
  <div class="slot" id="hud-score"><span class="val" id="score">0</span></div>
  <div class="slot" id="hud-milk"><span class="val" id="milk">0</span></div>
  <div class="slot" id="hud-herd"><span class="val" id="cows-left">5</span></div>
</div>
<div id="streak-badge" class="hidden">ON FIRE ×2</div>
<div id="field-frame"><div id="field"></div></div>
<div id="tray" class="wood"><span class="label">HERD</span><span id="tray-cows" style="display:flex;gap:4px;"></span></div>
<div id="shop"></div>
<div id="msg"></div>

<div id="overlay">
  <svg class="ufo-hero" viewBox="0 0 120 60" id="ufo-hero"></svg>
  <h1>MOO.F.O</h1>
  <div class="panel wood">Aliens are coming.<br>Save your cows from them.</div>
  <button id="start-btn">PROTECT THE HERD</button>
</div>

<script>
  const START_SIZE = 5;
  const MAX_SIZE = 8;
  const N_COWS = 5;
  const MAX_COWS = 8;
  const SHED_SURVIVAL = 0.75;

  const COW_NAMES = ['Marguerite', 'Huguette', 'Gertrude', 'Josiane', 'Paulette', 'Bernadette', 'Ginette', 'Raymonde', 'Colette', 'Monique', 'Jacqueline', 'Odette'];
  const ABDUCT_MSGS = [
    '{n} got beamed up. She always was the pretty one.',
    'The aliens took {n}. RIP her milk.',
    '{n} is now touring the galaxy. Without consent.',
    '{n} has left the pasture. Vertically.',
    'Farewell {n}, you were the least annoying one.'
  ];
  const GRASS_MSGS = [
    'They abducted… grass. Great job, aliens.',
    'The beam hit nothing. Intergalactic embarrassment.',
    'They took a rock. Science, probably.'
  ];
  const SCARE_MSGS = [
    'The aliens probed the scarecrow. They seem confused.',
    'Scarecrow abducted. They will be SO disappointed.'
  ];

  let SIZE = START_SIZE;
  let sheds = new Set(), burnt = new Set(), circles = new Set(), scarecrows = new Set();
  let cows = new Map();
  let tray = [];
  let namePool = [];
  let plannedTargets = [];
  let crateCell = -1;
  let waveMod = null;
  let wave = 1, score = 0, streak = 0, milk = 0, lastHerdSize = N_COWS;
  let landCost = 18, cowCost = 14;
  let bossRow = -1;
  let phase = 'idle';
  let launchTimeout = null;
  let placingItem = null;
  let mooInt = null;
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  let best = parseInt((store && store.getItem('moofo-best')) || '0', 10);

  const field = document.getElementById('field');
  const frame = document.getElementById('field-frame');
  const msg = document.getElementById('msg');
  const overlay = document.getElementById('overlay');

  function mulberry(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ================================================================
     ART DIRECTION — each asset drawn with light from top-left,
     soft cast shadows, 2-tone shading, warm farm palette.
     ================================================================ */

  function cowSVG(cow) {
    const rnd = mulberry(cow.seed);
    const rot = Math.floor(rnd() * 40 - 20);
    const body = cow.golden ? '#f4d98d' : '#f6f1e7';
    const low  = cow.golden ? '#e3bd66' : '#e6dfcd';
    const line = cow.golden ? '#c9a04e' : '#cfc7b2';
    const patch = cow.golden ? '#b8863b' : '#45403a';
    let patches = '';
    for (let k = 0; k < 3; k++) {
      const px = 32 + rnd() * 34, py = 34 + rnd() * 32;
      const s = 8 + rnd() * 7;
      const r2 = Math.floor(rnd() * 360);
      patches += `<path d="M${px - s} ${py} q${-s * 0.4} ${-s} ${s * 0.5} ${-s * 1.1} q${s * 1.1} ${-0.2 * s} ${s * 1.3} ${s * 0.7} q${0.2 * s} ${s * 1.1} ${-s * 0.8} ${s * 1.2} q${-s} ${0.1 * s} ${-s} ${-0.8 * s} z"
        fill="${patch}" opacity="0.92" transform="rotate(${r2} ${px} ${py})"/>`;
    }
    const sparkle = cow.golden
      ? `<path d="M82 14 l2.4 5 5 2.4 -5 2.4 -2.4 5 -2.4 -5 -5 -2.4 5 -2.4 z" fill="#fff2c4"/>
         <path d="M20 70 l1.7 3.5 3.5 1.7 -3.5 1.7 -1.7 3.5 -1.7 -3.5 -3.5 -1.7 3.5 -1.7 z" fill="#fff2c4" opacity="0.85"/>`
      : '';
    return `<svg viewBox="0 0 100 100"><g transform="rotate(${rot} 50 50)">
      <ellipse cx="53" cy="60" rx="25" ry="32" fill="rgba(25,35,16,0.28)"/>
      <ellipse cx="50" cy="55" rx="25" ry="33" fill="${body}"/>
      <path d="M28 65 a25 33 0 0 0 44 0 a30 20 0 0 1 -44 0 z" fill="${low}" opacity="0.7"/>
      <ellipse cx="50" cy="55" rx="25" ry="33" fill="none" stroke="${line}" stroke-width="1.6"/>
      ${patches}
      <ellipse cx="50" cy="19" rx="12.5" ry="10.5" fill="${body}" stroke="${line}" stroke-width="1.6"/>
      <ellipse cx="50" cy="13.5" rx="7.5" ry="4.8" fill="#e8aca2"/>
      <circle cx="47.4" cy="13" r="1.1" fill="#b97f74"/><circle cx="52.6" cy="13" r="1.1" fill="#b97f74"/>
      <path d="M36 17 q-6 -3 -7 2 q1 4 6 2.5 z" fill="${body}" stroke="${line}" stroke-width="1.3"/>
      <path d="M64 17 q6 -3 7 2 q-1 4 -6 2.5 z" fill="${body}" stroke="${line}" stroke-width="1.3"/>
      <path d="M37 16.5 q-3 -1 -4 1.2 q1 1.8 3.4 1 z" fill="#e8aca2" opacity="0.8"/>
      <path d="M63 16.5 q3 -1 4 1.2 q-1 1.8 -3.4 1 z" fill="#e8aca2" opacity="0.8"/>
      <path d="M50 88 q5 5 2 10" stroke="${line}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="52.5" cy="98" r="2.6" fill="${patch}"/>
      <ellipse cx="42" cy="42" rx="8" ry="14" fill="#ffffff" opacity="0.22" transform="rotate(-14 42 42)"/>
      ${sparkle}
    </g></svg>`;
  }

  function shedSVG() {
    return `<svg viewBox="0 0 100 100">
      <ellipse cx="53" cy="56" rx="41" ry="38" fill="rgba(25,35,16,0.25)"/>
      <rect x="9" y="12" width="82" height="78" rx="5" fill="#6e2a1c"/>
      <rect x="13" y="16" width="37" height="70" rx="2" fill="#a84632"/>
      <rect x="50" y="16" width="37" height="70" rx="2" fill="#8c3626"/>
      <g stroke="#7c2d22" stroke-width="1.4" opacity="0.85">
        <line x1="13" y1="27" x2="50" y2="27"/><line x1="13" y1="39" x2="50" y2="39"/>
        <line x1="13" y1="51" x2="50" y2="51"/><line x1="13" y1="63" x2="50" y2="63"/>
        <line x1="13" y1="75" x2="50" y2="75"/>
      </g>
      <g stroke="#63241a" stroke-width="1.4" opacity="0.85">
        <line x1="50" y1="27" x2="87" y2="27"/><line x1="50" y1="39" x2="87" y2="39"/>
        <line x1="50" y1="51" x2="87" y2="51"/><line x1="50" y1="63" x2="87" y2="63"/>
        <line x1="50" y1="75" x2="87" y2="75"/>
      </g>

  document.getElementById('hud-score').insertAdjacentHTML('afterbegin', starIcon());
  document.getElementById('hud-milk').insertAdjacentHTML('afterbegin', milkIcon());
  document.getElementById('hud-herd').insertAdjacentHTML('afterbegin', cowIcon());

  /* ---------- ROLLING COUNTERS (casino tick) ---------- */
  const disp = { score: 0, milk: 0 };
  function tween(id, to) {
    const el = document.getElementById(id);
    const from = disp[id];
    disp[id] = to;
    if (from === to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 550;
    (function f(t) {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(f);
    })(t0);
  }

  /* ---------- BIG TITLE CARDS ---------- */
  function burstSVG() {
    let rays = '';
    for (let k = 0; k < 12; k++) {
      const a = k * 30;
      rays += `<path d="M170 170 L${170 + 160 * Math.cos((a - 7) * Math.PI / 180)} ${170 + 160 * Math.sin((a - 7) * Math.PI / 180)} L${170 + 160 * Math.cos((a + 7) * Math.PI / 180)} ${170 + 160 * Math.sin((a + 7) * Math.PI / 180)} Z" fill="rgba(255,214,113,0.35)"/>`;
    }
    return `<svg viewBox="0 0 340 340">${rays}</svg>`;
  }
  function showTitle(text, cls = '', withBurst = false) {
    const old = document.getElementById('title-card');
    if (old) old.remove();
    const d = document.createElement('div');
    d.id = 'title-card';
    d.innerHTML = (withBurst ? `<div class="burst">${burstSVG()}</div>` : '') + `<div class="tc ${cls}">${text}</div>`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1950);
  }

  /* ---------- SHOP ---------- */
  const SHOP = [
    { id: 'barn', name: 'BARN', icon: shedSVG, unlock: 2,
      cost: () => 8, maxed: () => false,
      desc: 'Build a barn on any free spot (75% safe).' },
    { id: 'land', name: 'MORE LAND', icon: landSVG, unlock: 4,
      cost: () => landCost, maxed: () => SIZE >= MAX_SIZE,
      desc: 'Expand the pasture — more room to dodge the beams.' },
    { id: 'radar', name: 'RADAR', icon: radarSVG, unlock: 5,
      cost: () => 6, maxed: () => circles.size >= plannedTargets.length,
      desc: 'Intel! Reveals 4 spots the aliens WILL strike this wave (crop circles).' },
    { id: 'cow', name: 'NEW COW', icon: () => cowSVG({ seed: 42, golden: false }), unlock: 6,
      cost: () => cowCost, maxed: () => cows.size + tray.length >= MAX_COWS,
      desc: 'Adopt a new cow. More cows = more milk = more points.' },
    { id: 'scare', name: 'SCARECROW', icon: scarecrowSVG, unlock: 7,
      cost: () => 5, maxed: () => false,
      desc: 'Aliens can\'t resist probing it — absorbs 2 beams, then gets abducted.' }
  ];

  function renderShop() {
    const el = document.getElementById('shop');
    el.innerHTML = '';
    if (phase !== 'place' || wave < 2) return;
    SHOP.forEach(item => {
      const locked = wave < item.unlock;
      const maxed = item.maxed();
      const afford = milk >= item.cost();
      const dis = locked || maxed || !afford;
      const d = document.createElement('div');
      d.className = 'shop-item wood' + (dis ? ' disabled' : '') + (placingItem === item.id ? ' selected' : '');
      d.title = item.desc;
      d.innerHTML = `<div class="ico">${item.icon()}</div><div class="nm">${item.name}</div>` +
        (locked ? `<div class="lock">wave ${item.unlock}</div>`
          : maxed ? `<div class="lock">MAX</div>`
          : `<div class="cost">🥛 ${item.cost()}</div>`);
      d.addEventListener('click', () => buyItem(item, dis));
      el.appendChild(d);
    });
  }

  function buyItem(item, dis) {
    if (phase !== 'place' || dis) return;
    if (launchTimeout) { clearTimeout(launchTimeout); launchTimeout = null; }
    if (item.id === 'land') {
      milk -= item.cost();
      landCost += 10;
      expandField();
      showTitle('PASTURE<br>EXPANDED!', 'gold', true);
      setMsg(placeMsg());
      armLaunch(); render(); return;
    }
    if (item.id === 'cow') {
      milk -= item.cost();
      cowCost += 6;
      const c = newCow(false);
      tray.push(c);
      showTitle('WELCOME<br>' + c.name.toUpperCase() + '!', '', false);
      setMsg('A new cow joined the herd — <span class="hl">place her!</span>');
      render(); return;
    }
    if (item.id === 'radar') {
      milk -= item.cost();
      const hidden = plannedTargets.filter(i => !circles.has(i));
      for (let k = 0; k < 4 && hidden.length; k++) {
        const idx = Math.floor(Math.random() * hidden.length);
        circles.add(hidden.splice(idx, 1)[0]);
      }
      showBanner('📡 INTEL RECEIVED!');
      setMsg('<span class="warn">Crop circles = spots they WILL strike.</span> Plan around them!');
      armLaunch(); render(); return;
    }
    placingItem = placingItem === item.id ? null : item.id;
    setMsg(placingItem ? `Pick a spot for your <span class="hl">${item.name.toLowerCase()}</span>…` : placeMsg());
    render();
  }

  function newCow(golden) {
    if (!namePool.length) namePool = ['Cowette', 'Milka', 'Biquette', 'Brunette'];
    return {
      seed: Math.floor(Math.random() * 99999),
      golden: golden,
      name: golden ? 'Beyoncé' : namePool.shift()
    };
  }

  function expandField() {
    const old = SIZE;
    SIZE++;
    const remapSet = (s) => {
      const ns = new Set();
      s.forEach(i => { const x = i % old, y = (i - x) / old; ns.add(y * SIZE + x); });
      return ns;
    };
    sheds = remapSet(sheds); burnt = remapSet(burnt);
    circles = remapSet(circles); scarecrows = remapSet(scarecrows);
    plannedTargets = plannedTargets.map(i => { const x = i % old, y = (i - x) / old; return y * SIZE + x; });
    if (crateCell >= 0) { const x = crateCell % old, y = (crateCell - x) / old; crateCell = y * SIZE + x; }
    const nc = new Map();
    cows.forEach((cw, i) => { const x = i % old, y = (i - x) / old; nc.set(y * SIZE + x, cw); });
    cows = nc;
    planExtraTargets();
    buildField();
  }

  function planExtraTargets() {
    const want = strikeCount();
    const pool = [...Array(SIZE * SIZE).keys()].filter(i => !plannedTargets.includes(i));
    while (plannedTargets.length < want && pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      plannedTargets.push(pool.splice(idx, 1)[0]);
    }
  }

  /* ---------- LAYOUT ---------- */
  function fieldSize() {
    const w = Math.min(window.innerWidth * 0.94, 540);
    const h = window.innerHeight - 300;
    return Math.max(270, Math.min(w, h));
  }

  function buildField() {
    const fs = fieldSize();
    document.documentElement.style.setProperty('--fs', fs + 'px');
    document.documentElement.style.setProperty('--cs', (fs / SIZE) + 'px');
    field.innerHTML = '';
    const rnd = mulberry(Date.now() & 0xffff);
    for (let k = 0; k < 8 + SIZE * 3; k++) {
      const d = document.createElement('div');
      d.className = 'deco';
      const s = 8 + rnd() * 14;
      d.style.cssText = `left:${rnd() * 96}%;top:${rnd() * 96}%;width:${s}px;height:${s}px;opacity:${0.5 + rnd() * 0.5};z-index:1;`;
      d.innerHTML = rnd() > 0.25 ? tuftSVG(rnd) : flowerSVG(rnd);
      field.appendChild(d);
    }
    for (let i = 0; i < SIZE * SIZE; i++) {
      const x = i % SIZE, y = Math.floor(i / SIZE);
      const c = document.createElement('div');
      c.className = 'cell' + (((x + y) % 2) ? ' alt' : '');
      c.style.left = (x * 100 / SIZE) + '%';
      c.style.top = (y * 100 / SIZE) + '%';
      c.dataset.i = i;
      c.addEventListener('click', () => cellClick(i));
      c.addEventListener('pointerdown', (e) => fieldPointerDown(e, i));
      field.appendChild(c);
    }
    field.insertAdjacentHTML('beforeend', `<svg id="ufo" viewBox="0 0 120 60">${ufoSVG('u1')}</svg>`);
    field.insertAdjacentHTML('beforeend', `<svg id="mothership" viewBox="0 0 120 60">${ufoSVG('ms')}</svg>`);
    render();
  }

  function cellEl(i) { return field.querySelector(`.cell[data-i="${i}"]`); }

  function render() {
    field.querySelectorAll('.cow-wrap, .shed-wrap, .burnt-wrap, .circle-wrap, .scare-wrap, .crate-wrap').forEach(e => e.remove());
    field.querySelectorAll('.cell').forEach(c => {
      const i = +c.dataset.i;
      const free = !cows.has(i) && !sheds.has(i) && !scarecrows.has(i) && i !== crateCell;
      c.classList.toggle('placable', phase === 'place' && !placingItem && !cows.has(i) && i !== crateCell && tray.length > 0);
      c.classList.toggle('buildable', phase === 'place' && !!placingItem && free && !burnt.has(i));
      c.classList.toggle('hazard', phase === 'place' && bossRow >= 0 && Math.floor(i / SIZE) === bossRow);
      if (burnt.has(i)) { const b = document.createElement('div'); b.className = 'burnt-wrap'; b.innerHTML = burntSVG(); c.appendChild(b); }
      if (circles.has(i) && phase === 'place') { const g = document.createElement('div'); g.className = 'circle-wrap'; g.innerHTML = circleSVG(); c.appendChild(g); }
      if (sheds.has(i)) { const sh = document.createElement('div'); sh.className = 'shed-wrap'; sh.innerHTML = shedSVG(); c.appendChild(sh); }
      if (scarecrows.has(i)) { const sc = document.createElement('div'); sc.className = 'scare-wrap'; sc.innerHTML = scarecrowSVG(); c.appendChild(sc); }
      if (i === crateCell) { const cr = document.createElement('div'); cr.className = 'crate-wrap'; cr.innerHTML = crateSVG(); c.appendChild(cr); }
      if (cows.has(i)) { const w = document.createElement('div'); w.className = 'cow-wrap'; w.innerHTML = cowSVG(cows.get(i)); c.appendChild(w); }
    });
    const trayEl = document.getElementById('tray-cows');
    trayEl.innerHTML = '';
    tray.forEach((cw, idx) => {
      const d = document.createElement('div');
      d.className = 'tray-cow';
      d.innerHTML = cowSVG(cw);
      d.addEventListener('pointerdown', (e) => trayPointerDown(e, idx));
      trayEl.appendChild(d);
    });
    tween('score', score);
    tween('milk', milk);
    document.getElementById('cows-left').textContent = cows.size + tray.length;
    const badge = document.getElementById('streak-badge');
    if (streak > 0) {
      badge.textContent = '🔥 ON FIRE ×' + (1 + streak);
      badge.classList.remove('hidden');
    } else badge.classList.add('hidden');
    renderShop();
  }

  /* ---------- DRAG & DROP ---------- */
  let drag = null;
  let suppressClick = false;

  function trayPointerDown(e, idx) {
    if (phase !== 'place' || placingItem) return;
    drag = { from: 'tray', idx, sx: e.clientX, sy: e.clientY, moved: false, cow: tray[idx] };
  }
  function fieldPointerDown(e, i) {
    if (phase !== 'place' || placingItem || !cows.has(i)) return;
    drag = { from: i, sx: e.clientX, sy: e.clientY, moved: false, cow: cows.get(i) };
  }

  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7) return;
      drag.moved = true;
      if (drag.from === 'tray') tray.splice(drag.idx, 1);
      else {
        cows.delete(drag.from);
        if (launchTimeout) { clearTimeout(launchTimeout); launchTimeout = null; setMsg(placeMsg()); }
      }
      const g = document.createElement('div');
      g.id = 'drag-ghost';
      g.innerHTML = cowSVG(drag.cow);
      document.body.appendChild(g);
      render();
    }
    const g = document.getElementById('drag-ghost');
    if (g) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
    field.querySelectorAll('.cell.drop-ok').forEach(c => c.classList.remove('drop-ok'));
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell && !cows.has(+cell.dataset.i) && +cell.dataset.i !== crateCell) cell.classList.add('drop-ok');
  });

  document.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const d = drag; drag = null;
    const g = document.getElementById('drag-ghost');
    if (g) g.remove();
    field.querySelectorAll('.cell.drop-ok').forEach(c => c.classList.remove('drop-ok'));
    if (!d.moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 50);
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (cell && !cows.has(+cell.dataset.i) && +cell.dataset.i !== crateCell) {
      cows.set(+cell.dataset.i, d.cow);
    } else {
      tray.push(d.cow);
    }
    armLaunch();
    render();
  });

  function cellFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.cell') : null;
  }

  function cellClick(i) {
    if (suppressClick || phase !== 'place') return;
    if (i === crateCell) { openCrate(i); return; }
    if (placingItem) {
      const free = !cows.has(i) && !sheds.has(i) && !scarecrows.has(i) && !burnt.has(i) && i !== crateCell;
      if (!free) return;
      const item = SHOP.find(s => s.id === placingItem);
      milk -= item.cost();
      if (placingItem === 'barn') sheds.add(i);
      if (placingItem === 'scare') scarecrows.add(i);
      placingItem = null;
      setMsg(placeMsg());
      armLaunch();
      render();
      return;
    }
    if (cows.has(i)) {
      tray.push(cows.get(i));
      cows.delete(i);
      if (launchTimeout) { clearTimeout(launchTimeout); launchTimeout = null; setMsg(placeMsg()); }
    } else if (tray.length > 0) {
      cows.set(i, tray.shift());
      armLaunch();
    }
    render();
  }

  /* ---------- MYSTERY CRATE ---------- */
  function openCrate(i) {
    crateCell = -1;
    const c = cellEl(i);
    const roll = Math.random();
    let popText;
    if (roll < 0.45) {
      const m = 3 + Math.floor(Math.random() * 3);
      milk += m; popText = '+' + m + ' 🥛';
    } else if (roll < 0.7) {
      const m = 7 + Math.floor(Math.random() * 4);
      milk += m; popText = '+' + m + ' 🥛!';
    } else if (roll < 0.85) {
      scarecrows.add(i); popText = 'FREE SCARECROW!';
      setMsg('The crate had a <span class="hl">scarecrow</span> inside. Handy!');
    } else {
      milk += 15; popText = '+15 🥛';
      showTitle('JACKPOT!', 'gold', true);
    }
    if (c) {
      const p = document.createElement('div');
      p.className = 'milk-pop';
      p.textContent = popText;
      c.appendChild(p);
      setTimeout(() => p.remove(), 1150);
    }
    render();
  }

  /* ---------- LUCKY WHEEL (every 3 waves) ---------- */
  const WHEEL_SEGMENTS = [
    { label: '+3', color: '#7bb262', reward: () => { milk += 3; return '+3 🥛'; } },
    { label: '+6', color: '#5f8f45', reward: () => { milk += 6; return '+6 🥛'; } },
    { label: 'MOO', color: '#8a6238', reward: () => 'Moo. Nothing.' },
    { label: 'BARN', color: '#a84632', reward: () => { freeBarn(); return 'FREE BARN!'; } },
    { label: '+10', color: '#3f6c9e', reward: () => { milk += 10; return '+10 🥛!'; } },
    { label: '+20', color: '#eda93c', reward: () => { milk += 20; return 'JACKPOT +20 🥛!'; } }
  ];
  const WHEEL_WEIGHTS = [28, 24, 16, 12, 13, 7];

  function freeBarn() {
    const pool = [...Array(SIZE * SIZE).keys()].filter(i =>
      !sheds.has(i) && !burnt.has(i) && !cows.has(i) && !scarecrows.has(i) && i !== crateCell);
    if (pool.length) sheds.add(pool[Math.floor(Math.random() * pool.length)]);
  }

  function wheelSVG() {
    let paths = '';
    WHEEL_SEGMENTS.forEach((seg, k) => {
      const a0 = (k * 60 - 90) * Math.PI / 180;
      const a1 = ((k + 1) * 60 - 90) * Math.PI / 180;
      const x0 = 150 + 130 * Math.cos(a0), y0 = 150 + 130 * Math.sin(a0);
      const x1 = 150 + 130 * Math.cos(a1), y1 = 150 + 130 * Math.sin(a1);
      const am = (k * 60 + 30 - 90) * Math.PI / 180;
      const lx = 150 + 85 * Math.cos(am), ly = 150 + 85 * Math.sin(am);
      paths += `<path d="M150 150 L${x0} ${y0} A130 130 0 0 1 ${x1} ${y1} Z" fill="${seg.color}" stroke="#4e3419" stroke-width="3"/>
        <text x="${lx}" y="${ly + 7}" font-size="21" font-family="Lilita One, cursive" fill="#f7efdd" text-anchor="middle" transform="rotate(${k * 60 + 30} ${lx} ${ly})">${seg.label}</text>`;
    });
    let studs = '';
    for (let k = 0; k < 12; k++) {
      const a = (k * 30 - 90) * Math.PI / 180;
      studs += `<circle cx="${150 + 138 * Math.cos(a)}" cy="${150 + 138 * Math.sin(a)}" r="4" fill="#d9b968"/>`;
    }
    return `
      <circle cx="150" cy="150" r="146" fill="#6e4c2a" stroke="#4e3419" stroke-width="5"/>
      <g id="wheel-rotor">${paths}
        <circle cx="150" cy="150" r="24" fill="#8a6238" stroke="#4e3419" stroke-width="4"/>
        <circle cx="150" cy="150" r="9" fill="#d9b968"/>
      </g>
      ${studs}`;
  }

  function showWheel() {
    const ov = document.createElement('div');
    ov.id = 'wheel-overlay';
    ov.innerHTML = `
      <div id="wheel-title">🎡 LUCKY SPIN!</div>
      <div id="wheel-box">
        <svg id="wheel-pointer" viewBox="0 0 34 40"><path d="M17 40 L2 6 Q17 -4 32 6 Z" fill="#eda93c" stroke="#4e3419" stroke-width="3"/></svg>
        <svg id="wheel-svg" viewBox="0 0 300 300">${wheelSVG()}</svg>
      </div>
      <button id="spin-btn">SPIN!</button>`;
    document.body.appendChild(ov);
    document.getElementById('spin-btn').addEventListener('click', () => {
      const btn = document.getElementById('spin-btn');
      btn.disabled = true; btn.style.opacity = 0.5;
      const total = WHEEL_WEIGHTS.reduce((a, b) => a + b, 0);
      let r = Math.random() * total, seg = 0;
      for (let k = 0; k < WHEEL_WEIGHTS.length; k++) { r -= WHEEL_WEIGHTS[k]; if (r <= 0) { seg = k; break; } }
      const jitter = (Math.random() * 36 - 18);
      const target = 360 * 4 + (360 - (seg * 60 + 30)) + jitter;
      const rotor = document.getElementById('wheel-rotor');
      rotor.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.9, 0.12, 1)';
      rotor.style.transform = `rotate(${target}deg)`;
      setTimeout(() => {
        const resText = WHEEL_SEGMENTS[seg].reward();
        ov.remove();
        showTitle(resText, seg === 5 || seg === 3 ? 'gold' : '', seg === 5, true);
        render();
      }, 4600);
    });
  }

  function armLaunch() {
    if (tray.length === 0 && !placingItem && phase === 'place') {
      setMsg('<span class="warn">☄ INCOMING! ☄</span> (grab a cow back to buy more time)');
      clearTimeout(launchTimeout);
      launchTimeout = setTimeout(startAttack, 1600);
    }
  }

  function setMsg(html) { msg.innerHTML = html; }
  function placeMsg() {
    if (wave === 1) return 'Drag (or tap) your <span class="hl">5 cows</span> onto the field.<br>The golden one is worth <span class="hl">triple</span>. Good luck.';
    if (bossRow >= 0) return `<span class="warn">⚠ MOTHERSHIP DETECTED — it will vaporize the marked row! ⚠</span>`;
    if (waveMod === 'fullmoon') return '🌕 <span class="hl">FULL MOON — milk ×2 tonight!</span> Keep them alive.';
    if (waveMod === 'meteor') return '☄ <span class="warn">METEOR SHOWER — more beams, but points ×2!</span>';
    return `Wave ${wave} — place your herd, spend your milk wisely.`;
  }

  function showBanner(text) {
    const b = document.createElement('div');
    b.className = 'wave-banner';
    b.innerHTML = `<span>${text}</span>`;
    field.appendChild(b);
    setTimeout(() => b.remove(), 1550);
  }

  function shakeField() {
    frame.classList.remove('shake');
    void frame.offsetWidth;
    frame.classList.add('shake');
  }

  function startMoo() {
    clearInterval(mooInt);
    mooInt = setInterval(() => {
      if (phase !== 'place' || cows.size === 0) return;
      const keys = [...cows.keys()];
      const i = keys[Math.floor(Math.random() * keys.length)];
      const c = cellEl(i);
      if (!c) return;
      const b = document.createElement('div');
      b.className = 'moo-bubble';
      b.textContent = Math.random() > 0.85 ? 'Meuh?' : 'Moo.';
      c.appendChild(b);
      setTimeout(() => b.remove(), 1450);
    }, 2600);
  }

  /* ---------- GAME FLOW ---------- */
  function strikeCount() {
    const area = SIZE * SIZE;
    let n = Math.ceil(area * (0.15 + 0.045 * (wave - 1)));
    if (waveMod === 'meteor') n = Math.ceil(n * 1.4);
    return Math.min(n, Math.floor(area * 0.6));
  }

  function startPlacement() {
    phase = 'place';
    cows.forEach(cw => tray.push(cw));
    cows.clear();
    circles = new Set();
    placingItem = null;

    waveMod = (wave >= 4 && Math.random() < 0.25)
      ? (Math.random() < 0.5 ? 'fullmoon' : 'meteor') : null;

    plannedTargets = [];
    planExtraTargets();

    bossRow = (wave > 1 && wave % 5 === 0) ? Math.floor(Math.random() * SIZE) : -1;

    crateCell = -1;
    if (wave >= 2 && Math.random() < 0.4) {
      let guard = 0;
      do { crateCell = Math.floor(Math.random() * SIZE * SIZE); guard++; }
      while ((sheds.has(crateCell) || burnt.has(crateCell)) && guard < 100);
    }

    showTitle('WAVE ' + wave, wave % 5 === 0 ? 'red' : '');
    if (wave === 2) setTimeout(() => showBanner('🛒 THE FARM SHOP IS OPEN!'), 900);
    if (wave === 4) setTimeout(() => showBanner('🌱 MORE LAND FOR SALE!'), 900);
    if (wave === 5) setTimeout(() => showBanner('📡 RADAR UNLOCKED!'), 900);
    if (wave === 6) setTimeout(() => showBanner('🐄 NEW COWS FOR SALE!'), 900);
    if (wave === 7) setTimeout(() => showBanner('🎃 SCARECROW UNLOCKED!'), 900);
    if (waveMod === 'fullmoon') setTimeout(() => showBanner('🌕 FULL MOON — MILK ×2!'), 900);
    if (waveMod === 'meteor') setTimeout(() => showBanner('☄ METEOR SHOWER — POINTS ×2!'), 900);
    if (bossRow >= 0) setTimeout(() => showBanner('☠ MOTHERSHIP INCOMING!'), 900);

    if (wave > 1 && wave % 3 === 0) setTimeout(showWheel, 600);

    setMsg(placeMsg());
    render();
  }

  function startAttack() {
    launchTimeout = null;
    phase = 'attack';
    if (crateCell >= 0) crateCell = -1;
    render();
    setMsg('<span class="hl">THEY\'RE HERE.</span>');

    const targets = [...plannedTargets];
    scarecrows.forEach(i => { targets.push(i, i); });
    for (let k = targets.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [targets[k], targets[j]] = [targets[j], targets[k]];
    }

    let t = 0;
    const int = setInterval(() => {
      if (t >= targets.length) {
        clearInterval(int);
        document.getElementById('ufo').style.opacity = 0;
        if (bossRow >= 0) setTimeout(bossSweep, 500);
        else setTimeout(endWave, 700);
        return;
      }
      moveShip('ufo', targets[t]);
      const target = targets[t];
      setTimeout(() => strike(target), 230);
      t++;
    }, 300);
  }

  function bossSweep() {
    setMsg('<span class="warn">☠ THE MOTHERSHIP ☠</span>');
    const ms = document.getElementById('mothership');
    let x = 0;
    const int = setInterval(() => {
      if (x >= SIZE) {
        clearInterval(int);
        ms.style.opacity = 0;
        setTimeout(endWave, 700);
        return;
      }
      const i = bossRow * SIZE + x;
      moveShip('mothership', i);
      const target = i;
      setTimeout(() => strike(target), 90);
      x++;
    }, 160);
  }

  function moveShip(id, i) {
    const el = document.getElementById(id);
    if (!el) return;
    const x = (i % SIZE), y = Math.floor(i / SIZE);
    const w = id === 'mothership' ? 0.6 : 0.175;
    el.style.left = `calc(${x * 100 / SIZE}% - var(--cs) * ${w})`;
    el.style.top = `calc(${y * 100 / SIZE}% - var(--cs) * 0.45)`;
    el.style.opacity = 1;
  }

  function nearMiss(i) {
    const x = i % SIZE, y = Math.floor(i / SIZE);
    const neigh = [];
    if (x > 0) neigh.push(i - 1);
    if (x < SIZE - 1) neigh.push(i + 1);
    if (y > 0) neigh.push(i - SIZE);
    if (y < SIZE - 1) neigh.push(i + SIZE);
    for (const n of neigh) {
      if (cows.has(n) && Math.random() < 0.5) {
        const c = cellEl(n);
        if (c && !c.querySelector('.moo-bubble')) {
          const b = document.createElement('div');
          b.className = 'moo-bubble';
          b.textContent = Math.random() > 0.5 ? 'Phew!' : 'MOO?!';
          c.appendChild(b);
          setTimeout(() => b.remove(), 1450);
        }
        break;
      }
    }
  }

  function strike(i) {
    const c = cellEl(i);
    if (!c) return;
    const fl = document.createElement('div');
    fl.className = 'beam-flash';
    c.appendChild(fl);
    const col = document.createElement('div');
    col.className = 'beam-col';
    c.appendChild(col);
    setTimeout(() => { fl.remove(); col.remove(); }, 520);

    const inShed = sheds.has(i);
    if (scarecrows.has(i)) {
      scarecrows.delete(i);
      const sc = c.querySelector('.scare-wrap');
      if (sc) { sc.classList.add('abduct'); setTimeout(() => sc.remove(), 720); }
      setMsg('<span class="hl">' + SCARE_MSGS[Math.floor(Math.random() * SCARE_MSGS.length)] + '</span>');
    } else if (cows.has(i)) {
      const survives = inShed && Math.random() < SHED_SURVIVAL;
      if (!survives) {
        const cow = cows.get(i);
        cows.delete(i);
        const w = c.querySelector('.cow-wrap');
        if (w) { w.classList.add('abduct'); setTimeout(() => w.remove(), 720); }
        shakeField();
        setMsg(ABDUCT_MSGS[Math.floor(Math.random() * ABDUCT_MSGS.length)].replace('{n}', '<span class="warn">' + cow.name + '</span>'));
        document.getElementById('cows-left').textContent = cows.size + tray.length;
      } else {
        const b = document.createElement('div');
        b.className = 'moo-bubble';
        b.textContent = 'Safe!';
        c.appendChild(b);
        setTimeout(() => b.remove(), 1450);
      }
    } else {
      nearMiss(i);
      if (!inShed && Math.random() < 0.08) setMsg(GRASS_MSGS[Math.floor(Math.random() * GRASS_MSGS.length)]);
    }
    if (inShed) {
      sheds.delete(i);
      burnt.add(i);
      shakeField();
      const sh = c.querySelector('.shed-wrap');
      if (sh) {
        sh.classList.add('burn');
        setTimeout(() => {
          sh.remove();
          const b = document.createElement('div');
          b.className = 'burnt-wrap'; b.innerHTML = burntSVG();
          c.insertBefore(b, c.firstChild);
        }, 600);
      }
    }
  }

  function endWave() {
    const survivorCells = [...cows.keys()];
    const survivors = [...cows.values()];
    const value = survivors.reduce((s, cw) => s + (cw.golden ? 30 : 10), 0);
    let milkGain = survivors.reduce((s, cw) => s + (cw.golden ? 5 : 2), 0);
    if (waveMod === 'fullmoon') milkGain *= 2;
    const lostNone = survivors.length === lastHerdSize;
    if (survivors.length > 0 && lostNone) streak++; else streak = 0;
    const mult = 1 + streak;
    let gained = value * wave * mult;
    if (waveMod === 'meteor') gained *= 2;
    score += gained;
    milk += milkGain;
    render();
    if (survivors.length === 0) { gameOver(); return; }

    // verdict title card (casino style)
    if (lostNone) showTitle('PERFECT<br>NIGHT!', 'gold', true);
    else if (survivors.length === 1) showTitle('CLOSE CALL!', 'red');

    survivorCells.forEach((i, idx) => {
      setTimeout(() => {
        const c = cellEl(i);
        if (!c) return;
        const p = document.createElement('div');
        p.className = 'milk-pop';
        const base = cows.get(i) && cows.get(i).golden ? 5 : 2;
        p.textContent = '+' + (waveMod === 'fullmoon' ? base * 2 : base) + ' 🥛';
        c.appendChild(p);
        setTimeout(() => p.remove(), 1150);
      }, 300 + idx * 140);
    });
    setTimeout(() => showBanner(`✓ +${gained} PTS${streak > 0 ? ' &nbsp;×' + mult : ''}`), 700);

    setMsg(`Wave ${wave} survived — <span class="hl">+${gained} pts, +${milkGain} 🥛</span>${streak > 0 ? ` <span class="hl">streak ×${mult}!</span>` : ''}`);
    wave++;
    lastHerdSize = survivors.length;
    setTimeout(startPlacement, 2300);
  }

  function gameOver() {
    phase = 'over';
    clearInterval(mooInt);
    const isBest = score > best;
    if (isBest) { best = score; if (store) store.setItem('moofo-best', String(best)); }
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <svg class="ufo-hero" viewBox="0 0 120 60">${ufoSVG('go')}</svg>
      <h1>THE HERD<br><span class="green">IS GONE</span></h1>
      <div class="panel wood">You held out for ${wave} wave${wave > 1 ? 's' : ''}.</div>
      <div class="score-big">${score} PTS</div>
      <div class="best">${isBest ? '★ NEW BEST SCORE! ★' : 'Best: ' + best}</div>
      <button onclick="location.reload()">PLAY AGAIN</button>`;
    drawScenery();
    try { parent.postMessage({ type: 'nogo-score', points: score }, '*'); } catch (e) {}
  }

  /* ---------- SCENERY ---------- */
  function scenerySVG() {
    let stars = '';
    for (let k = 0; k < 110; k++) {
      const r = 0.4 + Math.random() * 1.4;
      stars += `<circle cx="${Math.random() * 100}%" cy="${Math.random() * 75}%" r="${r}" fill="rgba(255,255,255,${0.25 + Math.random() * 0.65})"/>`;
    }
    return `
      <svg class="stars">
        ${stars}
        <circle cx="82%" cy="16%" r="38" fill="#f2ecd8" opacity="0.95"/>
        <circle cx="80%" cy="14.5%" r="10" fill="#ddd5bd" opacity="0.5"/>
        <circle cx="85%" cy="19%" r="6" fill="#ddd5bd" opacity="0.5"/>
        <circle cx="79%" cy="19.5%" r="4" fill="#ddd5bd" opacity="0.4"/>
      </svg>
      <svg class="hills" viewBox="0 0 1000 220" preserveAspectRatio="none">
        <path d="M0 130 Q180 70 380 120 T720 110 Q870 90 1000 125 L1000 220 L0 220 Z" fill="#24401f"/>
        <path d="M0 170 Q250 120 520 160 T1000 155 L1000 220 L0 220 Z" fill="#182d15"/>
        <g fill="#0e1c0c">
          <rect x="120" y="118" width="64" height="46" rx="2"/>
          <path d="M112 122 L152 92 L192 122 Z"/>
          <rect x="210" y="140" width="5" height="26"/><rect x="234" y="142" width="5" height="26"/>
          <rect x="258" y="144" width="5" height="26"/><rect x="206" y="148" width="62" height="4"/>
          <ellipse cx="700" cy="168" rx="16" ry="9"/>
          <ellipse cx="712" cy="160" rx="6" ry="5"/>
          <ellipse cx="760" cy="174" rx="14" ry="8"/>
          <ellipse cx="750" cy="167" rx="5" ry="4.5"/>
        </g>
      </svg>`;
  }
  function drawScenery() { overlay.insertAdjacentHTML('afterbegin', scenerySVG()); }

  document.getElementById('ufo-hero').innerHTML = ufoSVG('hero');
  drawScenery();

  /* ---------- START ---------- */
  document.getElementById('start-btn').addEventListener('click', () => {
    overlay.classList.add('hidden');
    SIZE = START_SIZE;
    sheds = new Set(); burnt = new Set(); circles = new Set(); scarecrows = new Set();
    cows = new Map();
    tray = [];
    plannedTargets = [];
    crateCell = -1;
    waveMod = null;
    namePool = [...COW_NAMES].sort(() => Math.random() - 0.5);
    const goldenIdx = Math.floor(Math.random() * N_COWS);
    for (let k = 0; k < N_COWS; k++) tray.push(newCow(k === goldenIdx));
    wave = 1; score = 0; streak = 0; milk = 0;
    disp.score = 0; disp.milk = 0;
    landCost = 18; cowCost = 14;
    lastHerdSize = N_COWS;
    phase = 'place';
    buildField();
    startPlacement();
    startMoo();
  });

  window.addEventListener('resize', () => { if (phase === 'place') buildField(); });
</script>
</body>
</html>
